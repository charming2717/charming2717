  return `<div class="char-panel">
    <div class="cp-head">
      <div class="cp-avatar" style="--c:${color};"><img src="${getSVGDataURL(race, u.name)}" alt="${u.name}"/></div>
      <div class="cp-meta">
        <div class="cp-rarity" style="color:${color};">${RARITY_ICONS[u.rarity]} ${u.rarity}<span class="cp-role">${info.icon} ${info.role}</span><span class="cp-role" style="color:#fca5a5;background:rgba(244,63,94,0.18);">👹 敌方</span></div>
        <div class="cp-name" style="color:${color};">${u.name}</div>
        <div class="cp-tags"><span>🧬 ${race}</span><span>🗼 第 ${level} 层</span><span>${u.isDead ? '💀 已倒下' : '❤️ 存活'}</span></div>
      </div>
    </div>
    <div class="cp-battle-strip">
      <div class="cp-battle-top"><span>❤️ 生命 ${Math.max(0, Math.ceil(u.hp))} / ${u.maxHp}</span><span>⚡ 能量 ${Math.floor(u.energy)}%</span></div>
      <div class="cp-mini-bar"><i style="width:${hpPct}%;background:linear-gradient(90deg,#f43f5e,#fb7185);"></i></div>
    </div>
    <div class="cp-stat-grid">
      ${_cpStat('⚔️ 攻击', u.atk, '含层数强化')}
      ${_cpStat('❤️ 最大生命', u.maxHp, '含层数强化')}
      ${_cpStat('📈 强化倍率', '×' + mult.toFixed(2), `第 ${level} 层`)}
    </div>
    <div class="cp-block">
      <div class="cp-block-title"><span>📊 敌方面板说明</span></div>
      <div style="font-size:12px;color:#cbd5e1;line-height:1.8;">敌方不享受星级与装备加成，属性 = 同品质基础属性 × 第 ${level} 层强化倍率。<br/>其克制种族：<b style="color:#fbbf24;">${counterText}</b>，可据此调整我方阵容。</div>
    </div>
  </div>`;
}
function renderBattleStrip(u, level) {
  const hpPct = clamp((u.hp / u.maxHp) * 100, 0, 100);
  const energy = clamp(u.energy, 0, 100);
  const stateText = u.isDead ? '💀 已倒下' : (energy >= 100 ? '✨ 能量已满：点击该角色卡可释放大招' : '⚡ 能量满后可释放终极奥义');
  return `<div class="cp-battle-strip">
    <div class="cp-battle-top"><span style="color:#4ade80;">🛡️ 我方 · 第 ${level} 层</span><span>❤️ ${Math.max(0, Math.ceil(u.hp))} / ${u.maxHp}</span><span>⚡ ${Math.floor(energy)}%</span></div>
    <div class="cp-mini-bar"><i style="width:${hpPct}%;background:linear-gradient(90deg,#22c55e,#4ade80);"></i></div>
    <div style="font-size:11px;color:#64748b;">${stateText}　·　关闭面板后战斗继续（管理装备会结束本场战斗）</div>
  </div>`;
}
function showCharDetail(name, rarity) {
  rarity = rarity || RARITY_MAP.get(name) || 'N';
  charPanelContext = null;
  openModal('📜 角色详情', renderCharPanelHTML(name, rarity), false);
}
function showCharDetailOverlay(name, rarity) {
  rarity = rarity || RARITY_MAP.get(name) || 'N';
  charPanelContext = 'team';
  $('unitModalTitle').textContent = `📜 ${name} · 角色详情`;
  $('unitModalBody').innerHTML = renderCharPanelHTML(name, rarity, { fromTeam: true })
    + '<button class="cp-btn" style="margin-top:14px;background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.2);" onclick="closeBattleUnitPanel()">← 返回阵容</button>';
  $('unitModalBody').scrollTop = 0;
  $('unitModal').classList.add('show');
}
function refreshCharPanel(name, rarity) {
  if (charPanelContext === 'team') showCharDetailOverlay(name, rarity);
  else showCharDetail(name, rarity);
}
window.showCharDetailOverlay = showCharDetailOverlay;
function showBattleUnitPanel(side, idx) {
  if (!battleState) return;
  const isEnemy = side === 'e';
  const u = (isEnemy ? battleState.eTeam : battleState.pTeam)[idx];
  if (!u) return;
  pauseBattle();
  charPanelContext = null;
  const html = isEnemy ? renderEnemyPanelHTML(u, battleState.level) : renderBattleStrip(u, battleState.level) + renderCharPanelHTML(u.name, u.rarity, { hideUpgrade: true });
  $('unitModalTitle').textContent = isEnemy ? `👹 ${u.name} · 敌方面板` : `📜 ${u.name} · 角色面板`;
  $('unitModalBody').innerHTML = html;
  $('unitModalBody').scrollTop = 0;
  $('unitModal').classList.add('show');
}
function closeBattleUnitPanel() {
  $('unitModal').classList.remove('show');
  $('unitModalBody').innerHTML = '';
  const wasTeam = charPanelContext === 'team';
  charPanelContext = null;
  if (wasTeam) { renderTeamEditor(); return; }
  resumeBattle();
}
window.showBattleUnitPanel = showBattleUnitPanel;
window.closeBattleUnitPanel = closeBattleUnitPanel;
$('unitModalClose').onclick = closeBattleUnitPanel;
window.upgradeStar = upgradeStar;
window.autoUpgradeStar = autoUpgradeStar;

/* ============================================================
   10.5 Debug 模式（开发者/测试用）
   ============================================================ */
const dbgState = { eqRarity: 'RANDOM', charRarity: 'SSR', charRace: 'ALL', charName: '', towerLv: '', scroll: 0 };
function dbgSection(title) {
  return `<div style="margin-bottom:20px;"><div style="font-size:13px;color:#fbbf24;font-weight:800;margin-bottom:10px;">${title}</div>`;
}
function dbgBtn(label, onclick, cls = '') {
  return `<button class="${cls}" onclick="${onclick}" style="margin:0 6px 8px 0;padding:10px 14px;font-size:13px;border-radius:10px;">${label}</button>`;
}
function _dbgRarityChars(rarity) {
  const seen = new Set(); const out = [];
  for (const n of getAllCharsByRarity(rarity)) { if (!seen.has(n)) { seen.add(n); out.push(n); } }
  return out;
}
function _dbgAward(name) {
  const rarity = RARITY_MAP.get(name) || 'N';
  g.collection[name] = (g.collection[name] || 0) + 1;
  g.stats[rarity]++;
  if (!g.best || RARITY_ORDER[rarity] > RARITY_ORDER[g.best.rarity]) g.best = { rarity, char: name, limited: false };
  return rarity;
}
function captureDebugInputs() {
  const map = { dbgTowerLv: 'towerLv', dbgEqRarity: 'eqRarity', dbgCharRarity: 'charRarity', dbgCharRace: 'charRace', dbgCharName: 'charName' };
  for (const id in map) { const el = $(id); if (el) dbgState[map[id]] = el.value; }
  const body = $('modalBody'); if (body) dbgState.scroll = body.scrollTop;
}
function refreshDebug() { captureDebugInputs(); openDebugPanel(); }

function openDebugPanel() {
  const cleared = Math.max(0, g.towerLevel - 1);
  const unlocked = Math.min(g.towerLevel, CONFIG.TOWER_MAX_LEVEL);
  const towerLvValue = dbgState.towerLv === '' ? cleared : dbgState.towerLv;
  let html = '<div style="line-height:1.7;">';

  html += dbgSection('💰 货币资源');
  html += `<div style="font-size:13px;color:#94a3b8;margin-bottom:8px;">当前金币：<b style="color:#fbbf24;">${g.coins}</b> ｜ 免费抽：<b style="color:#fbbf24;">${g.freePulls}</b> ｜ 打工剩余：<b style="color:#fbbf24;">${g.workLeft}</b>/${CONFIG.WORK_MAX}</div>`;
  html += dbgBtn('+1,000 金币', 'debugAddCoins(1000)') + dbgBtn('+10,000 金币', 'debugAddCoins(10000)') + dbgBtn('+100,000 金币', 'debugAddCoins(100000)') + dbgBtn('💰 金币清零', 'debugClearCoins()') + dbgBtn('🎫 免费抽+10', 'debugAddFreePulls(10)') + dbgBtn('😴 重置打工', 'debugResetWork()') + '</div>';

  html += dbgSection('🎴 指定品质 · 随机 / 全部获得');
  for (const r of ['UR', 'SSR', 'SR', 'R', 'N']) {
    const pool = _dbgRarityChars(r);
    const own = pool.filter(n => (g.collection[n] || 0) > 0).length;
    const color = r === 'UR' ? '#f43f5e' : r === 'SSR' ? '#fbbf24' : r === 'SR' ? '#38bdf8' : r === 'R' ? '#4ade80' : '#94a3b8';
    html += `<div class="dbg-rarity-row"><span class="dbg-rarity-name" style="color:${color};">${RARITY_ICONS[r]} ${r}</span><span class="dbg-rarity-count">已拥有 ${own}/${pool.length}</span>${dbgBtn('🎲 随机1名', `debugGiveChar('${r}')`, 'dbg-mini')}${dbgBtn('🎲 随机10名', `debugGiveChar('${r}',10)`, 'dbg-mini')}${dbgBtn('📦 全部+1', `debugGiveAllRarity('${r}')`, 'dbg-mini')}</div>`;
  }
  html += `<div style="font-size:12px;color:#64748b;margin-bottom:14px;line-height:1.7;">「全部+1」会把该品质的<b style="color:#cbd5e1;">所有角色</b>各获得 1 张（含限定 UP 角色，含未拥有与已拥有）。</div>`;

  html += dbgSection('🎯 获得指定角色');
  let charList = _dbgRarityChars(dbgState.charRarity).filter(n => dbgState.charRace === 'ALL' || (RACE[n] || '人类') === dbgState.charRace);
  if (!charList.some(n => n === dbgState.charName)) dbgState.charName = charList.length ? charList[0] : '';
  const rarOpts = ['UR', 'SSR', 'SR', 'R', 'N'].map(r => `<option value="${r}" ${dbgState.charRarity === r ? 'selected' : ''}>${RARITY_ICONS[r]} ${r}</option>`).join('');
  const raceOpts = ['ALL', ...RACES].map(r => `<option value="${r}" ${dbgState.charRace === r ? 'selected' : ''}>${r === 'ALL' ? '全部种族' : r}</option>`).join('');
  const charOpts = charList.map(n => `<option value="${n}" ${n === dbgState.charName ? 'selected' : ''}>${(g.collection[n] || 0) > 0 ? '✓' : '○'} ${n}（${RACE[n] || '人类'}）</option>`).join('') || '<option value="">（该筛选下无角色）</option>';
  html += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;"><select id="dbgCharRarity" class="dbg-field" onchange="debugCharFilterChanged()" style="flex:1;min-width:110px;">${rarOpts}</select><select id="dbgCharRace" class="dbg-field" onchange="debugCharFilterChanged()" style="flex:1;min-width:110px;">${raceOpts}</select></div>`;
  html += `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;"><select id="dbgCharName" class="dbg-field" style="flex:2;min-width:180px;">${charOpts}</select>${dbgBtn('🎴 获得该角色', 'debugGiveSpecificChar(1)')}${dbgBtn('×5', 'debugGiveSpecificChar(5)')}${dbgBtn('×10', 'debugGiveSpecificChar(10)')}</div>`;
  html += `<div style="display:flex;gap:8px;flex-wrap:wrap;">${dbgBtn('🎁 一键满图鉴（补齐所有未拥有）', 'debugFillCollection()')}${dbgBtn('🌟 所有角色 +1', "debugGiveAllRarity('ALL')")}</div></div>`;

  html += dbgSection('🛡️ 保底状态');
  html += `<div style="font-size:13px;color:#94a3b8;margin-bottom:8px;">SR ${g.sinceSR}/${CONFIG.PITY_SR} ｜ SSR ${g.sinceSSR}/${CONFIG.PITY_SSR} ｜ UR ${g.sinceUR}/${CONFIG.PITY_UR} ｜ SSR大保底：<b style="color:${g.guaranteedSSR ? '#4ade80' : '#94a3b8'};">${g.guaranteedSSR ? '✔ 开启' : '✘ 关闭'}</b> ｜ UR大保底：<b style="color:${g.guaranteedUR ? '#4ade80' : '#94a3b8'};">${g.guaranteedUR ? '✔ 开启' : '✘ 关闭'}</b></div>`;
  html += dbgBtn('SSR 下抽必出', "debugForcePity('SSR')") + dbgBtn('UR 下抽必出', "debugForcePity('UR')") + dbgBtn('🧹 清空保底', 'debugClearPity()') + dbgBtn('切换SSR大保底', "debugToggleGuarantee('SSR')") + dbgBtn('切换UR大保底', "debugToggleGuarantee('UR')") + '</div>';

  html += dbgSection('⚔️ 塔与装备');
  html += `<div style="font-size:13px;color:#94a3b8;margin-bottom:8px;">已通关：<b style="color:#fbbf24;">${cleared}</b> 层 ｜ 解锁到：<b style="color:#fbbf24;">第 ${unlocked} 层</b> ｜ 当前层强化：<b style="color:#f43f5e;">×${getEnemyMult(Math.max(1, unlocked)).toFixed(2)}</b></div>`;
  html += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center;"><input id="dbgTowerLv" type="number" min="0" max="${CONFIG.TOWER_MAX_LEVEL}" value="${towerLvValue}" class="dbg-field" style="flex:1;min-width:120px;"/><button onclick="debugSetTower()" style="padding:10px 14px;font-size:13px;border-radius:10px;">通关到该层</button>${dbgBtn('🔓 解锁全部 300 层', 'debugUnlockTower()', 'dbg-mini')}</div>`;
  const eqOpts = [['RANDOM', '🎲 随机品质（按层数）'], ['N', 'N 普通'], ['R', 'R 稀有'], ['SR', 'SR 史诗'], ['SSR', 'SSR 传说'], ['UR', 'UR 神话']].map(([v, label]) => `<option value="${v}" ${dbgState.eqRarity === v ? 'selected' : ''}>${label}</option>`).join('');
  html += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center;"><select id="dbgEqRarity" class="dbg-field" style="flex:1;min-width:140px;">${eqOpts}</select><button onclick="debugGenEquip()" style="padding:10px 14px;font-size:13px;border-radius:10px;">🎒 生成装备入库</button></div></div>`;

  html += dbgSection('💾 存档（可复制 / 编辑 / 导入）');
  html += `<textarea id="dbgSave" rows="5" style="width:100%;box-sizing:border-box;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);border-radius:10px;color:#cbd5e1;font-size:12px;padding:10px;font-family:monospace;margin-bottom:8px;user-select:text;">${g.serialize()}</textarea>`;
  html += dbgBtn('📋 复制存档', 'debugCopySave()') + dbgBtn('📥 导入存档', 'debugImportSave()') + '</div>';

  html += '</div>';
  openModal('🛠️ Debug 面板', html, true);
  requestAnimationFrame(() => { const body = $('modalBody'); if (body && dbgState.scroll) body.scrollTop = dbgState.scroll; });
}

window.debugAddCoins = (n) => { g.coins += n; g.earned += n; saveGame(); renderStatus(); refreshDebug(); toast(`💰 金币 +${n}`); };
window.debugClearCoins = () => { g.coins = 0; saveGame(); renderStatus(); refreshDebug(); toast('💰 金币已清零'); };
window.debugAddFreePulls = (n) => { g.freePulls += n; saveGame(); renderStatus(); refreshDebug(); toast(`🎫 免费抽 +${n}`); };
window.debugResetWork = () => { g.workLeft = CONFIG.WORK_MAX; saveGame(); renderStatus(); refreshDebug(); toast('😴 打工次数已重置'); };
window.debugGiveChar = (rarity, times = 1) => {
  const pool = _dbgRarityChars(rarity);
  if (!pool.length) return toast('⚠️ 该品质无角色');
  const got = [];
  for (let i = 0; i < times; i++) { const name = pickRandom(pool); _dbgAward(name); got.push(name); }
  saveGame(); renderStatus(); refreshDebug();
  toast(times === 1 ? `🎴 获得 ${RARITY_ICONS[rarity]} ${got[0]}` : `🎴 获得 ${times} 名 ${rarity} 角色：${got.slice(0, 3).join('、')}${got.length > 3 ? ' 等' : ''}`);
};
window.debugGiveAllRarity = (rarity) => {
  const list = rarity === 'ALL' ? RARITY_LIST.flatMap(r => _dbgRarityChars(r)) : _dbgRarityChars(rarity);
  if (!list.length) return toast('⚠️ 没有可获得的角色');
  list.forEach(n => _dbgAward(n));
  saveGame(); renderStatus(); refreshDebug();
  toast(`📦 已获得 ${rarity === 'ALL' ? '全部品质' : rarity + ' 品质'} ${list.length} 名角色（各 +1）`);
};
window.debugGiveSpecificChar = (times = 1) => {
  const sel = $('dbgCharName');
  const name = sel ? sel.value : dbgState.charName;
  if (!name || !RARITY_MAP.has(name)) return toast('⚠️ 请先选择角色');
  const rarity = RARITY_MAP.get(name);
  for (let i = 0; i < times; i++) _dbgAward(name);
  saveGame(); renderStatus(); refreshDebug();
  toast(`🎴 获得 ${RARITY_ICONS[rarity]} ${name} ×${times}`);
};
window.debugCharFilterChanged = () => {
  captureDebugInputs();
  dbgState.charName = '';
  openDebugPanel();
};
window.debugFillCollection = () => {
  let cnt = 0;
  for (const rarity of ['N', 'R', 'SR', 'SSR', 'UR']) {
    for (const name of getAllCharsByRarity(rarity)) {
      if (!g.collection[name]) { g.collection[name] = 1; g.stats[rarity]++; cnt++; }
    }
  }
  saveGame(); renderStatus(); refreshDebug(); toast(`🎁 已补全 ${cnt} 个未拥有角色`);
};
window.debugForcePity = (rarity) => {
  if (rarity === 'SSR') g.sinceSSR = CONFIG.PITY_SSR - 1;
  else if (rarity === 'UR') g.sinceUR = CONFIG.PITY_UR - 1;
  saveGame(); renderStatus(); refreshDebug(); toast(`🛡️ ${rarity} 下一抽必出`);
};
window.debugClearPity = () => { g.sinceSR = 0; g.sinceSSR = 0; g.sinceUR = 0; g.guaranteedSSR = false; g.guaranteedUR = false; saveGame(); renderStatus(); refreshDebug(); toast('🧹 保底已清空'); };
window.debugToggleGuarantee = (rarity) => {
  if (rarity === 'SSR') g.guaranteedSSR = !g.guaranteedSSR;
  else g.guaranteedUR = !g.guaranteedUR;
  saveGame(); renderStatus(); refreshDebug(); toast('🎯 大保底状态已切换');
};
window.debugSetTower = () => {
  const el = $('dbgTowerLv'); if (!el) return;
  const lv = parseInt(el.value, 10);
  if (!Number.isFinite(lv)) return toast('⚠️ 请输入有效层数');
  const target = clamp(lv, 0, CONFIG.TOWER_MAX_LEVEL);
  g.towerLevel = target + 1;
  saveGame(); renderStatus(); refreshDebug(); toast(`⚔️ 已通关到第 ${target} 层`);
};
window.debugUnlockTower = () => {
  g.towerLevel = CONFIG.TOWER_MAX_LEVEL + 1;
  saveGame(); renderStatus(); refreshDebug(); toast('🔓 已解锁全部 300 层');
};
window.debugGenEquip = () => {
  const sel = $('dbgEqRarity'); const rarity = sel ? sel.value : 'RANDOM';
  dbgState.eqRarity = rarity;
  const level = Math.max(1, g.towerLevel - 1);
  const eq = generateEquipment(level);
  if (rarity !== 'RANDOM') {
    eq.rarity = rarity;
    eq.name = `${rarity}·${EQUIP_NAMES[eq.type][eq.race]}`;
    const mult = EQUIP_RARITY_MULT[rarity] * (1 + (level - 1) * 0.2);
    let baseAtk = 0, baseHp = 0;
    if (eq.type === '武器') baseAtk = 20;
    else if (eq.type === '护甲' || eq.type === '裤子') baseHp = 100;
    else { baseAtk = 5; baseHp = 30; }
    eq.atk = Math.floor(baseAtk * mult);
    eq.hp = Math.floor(baseHp * mult);
  }
  g.inventory.push(eq);
  saveGame(); renderStatus(); refreshDebug(); toast(`🎒 已生成 ${eq.name}`);
};
window.debugCopySave = () => {
  const text = g.serialize();
  const el = $('dbgSave');
  const fallback = () => { if (el) { el.focus(); el.select(); toast('📋 已选中存档文本，请手动 Ctrl+C'); } else toast('📋 已生成存档'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast('📋 存档已复制到剪贴板')).catch(fallback);
  } else fallback();
};
window.debugImportSave = () => {
  const el = $('dbgSave'); if (!el) return;
  try {
    const d = JSON.parse(el.value);
    if (!g.hydrate(d)) return toast('⚠️ 导入失败：存档格式无效');
    saveGame(); location.reload();
  } catch (e) { toast('⚠️ 导入失败：JSON 解析错误'); }
};

/* ============================================================
   11. 事件绑定与启动
   ============================================================ */
function bindEvent(id, fn) { const el = $(id); if (el) el.onclick = fn; }

bindEvent('btnSingle', () => {
  if (_pullAnimating) return toast('✨ 出金特效播放中…');
  const res = rollOne(); if (res.error) return toast(res.error);
  renderStatus(); saveGame(); presentPullResults([res.result]);
});
bindEvent('btnTen', () => {
  if (_pullAnimating) return toast('✨ 出金特效播放中…');
  const res = rollTen(); if (res.error) return toast(res.error);
  renderStatus(); saveGame(); presentPullResults(res.results);
});
bindEvent('btnWork', () => { const res = work(); if (res.error) return toast(res.error); toast(`🔨 打工获得 ${res.gain} 金币`); renderStatus(); saveGame(); });
bindEvent('btnRest', () => { g.workLeft = CONFIG.WORK_MAX; toast('😴 打工次数已重置'); renderStatus(); saveGame(); });
bindEvent('btnSell', openSellUI);
bindEvent('btnInventory', openInventoryUI);
bindEvent('btnTeam', openTeamPanel);
bindEvent('btnBanner', openBannerSelect);
bindEvent('btnBattle', openBattle);
bindEvent('btnRecords', openRecordsUI);
bindEvent('btnRules', openRulesUI);
bindEvent('btnDebug', openDebugPanel);
bindEvent('btnDex', () => { dexState.owned = true; dexState.rarity = 'ALL'; dexState.race = 'ALL'; dexState.sort = 'rarity'; dexState.currentPage = 1; dexState.filterOpen = false; openModal('📖 角色图鉴', '', true); renderDex(); });
bindEvent('btnReset', () => { if (!confirm('重置将清空所有进度，确定？')) return; _resetFlag = true; clearTimeout(_saveTimer); safeRemoveItem(CONFIG.SAVE_KEY); location.reload(); });

function init() {
  loadGame(); renderStatus();
  POOL.forEach(p => {
    const span = document.createElement('span'); span.className = `rate-tag ${p.r}`;
    span.textContent = `${RARITY_ICONS[p.r]} ${p.r}: ${p.w}%`; $('ratesRow').appendChild(span);
  });
  toast('🎉 八大种族已就绪');
}
document.addEventListener('DOMContentLoaded', init);
if (document.readyState !== 'loading') init();
</script>
