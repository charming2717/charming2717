<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🎴 抽卡模拟器 · 八族争霸版</title>
<style>
  :root{
    --n:#94a3b8; --r:#4ade80; --sr:#38bdf8; --ssr:#fbbf24; --ur:#f43f5e;
    --glass: linear-gradient(135deg, rgba(30, 41, 59, 0.75), rgba(15, 23, 42, 0.85));
    --glass-border: rgba(255, 255, 255, 0.12);
    --primary: #fbbf24; --primary-dark: #d97706; --bg-color: #060913;
  }
  *{box-sizing:border-box;margin:0;padding:0;user-select:none;}
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); border-radius: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(251, 191, 36, 0.3); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(251, 191, 36, 0.6); }
  body{
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background-color: var(--bg-color); background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, transparent 60%), radial-gradient(circle at 10% 90%, #0f172a 0%, transparent 50%);
    background-attachment: fixed; color:#f1f5f9; min-height:100vh; display:flex; justify-content:center; padding:24px 16px; -webkit-font-smoothing: antialiased;
  }
  .app{width:min(1000px,100%);display:flex;flex-direction:column;gap:20px;}
  .glass-panel { background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1); }
  header{ display:flex;align-items:center;justify-content:space-between; flex-wrap:wrap;gap:12px;padding:20px 28px; }
  header h1{font-size:22px;font-weight:900;letter-spacing:2px; background:linear-gradient(90deg, #fff, #fbbf24); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}
  .banner-name{font-size:14px;color:var(--primary);margin-top:8px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .coins{ font-size:24px;font-weight:900;color:var(--primary); display:flex;align-items:center;gap:8px; }
  .coins small{font-size:13px;color:#94a3b8;font-weight:600;text-shadow:none;}
  .panel{padding:20px 28px;display:flex;flex-direction:column;gap:16px;}
  .panel .top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-size:13px;color:#cbd5e1;align-items:center;font-weight:500;}
  .up-list{color:var(--primary);font-size:14px;font-weight:700;line-height:1.6;}
  .bar-row{display:flex;align-items:center;gap:14px;font-size:13px;color:#94a3b8;font-weight:600;}
  .bar-row .label{width:100px;flex:none;display:flex;align-items:center;gap:4px;}
  .bar{flex:1;height:12px;background:rgba(0,0,0,0.6);border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,0.5); position:relative;}
  .bar > i{display:block;height:100%;width:0;border-radius:99px;transition:width .5s cubic-bezier(0.34, 1.56, 0.64, 1);background-image: linear-gradient(45deg, rgba(255,255,255,0.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.15) 75%, transparent 75%, transparent); background-size: 12px 12px; animation: progressStripes 1s linear infinite;}
  @keyframes progressStripes { from { background-position: 0 0; } to { background-position: 12px 0; } }
  .bar.sr > i{background-color:#38bdf8;box-shadow:0 0 12px rgba(56,189,248,0.6);}
  .bar.ssr > i{background-color:#fbbf24;box-shadow:0 0 12px rgba(251,191,36,0.6);}
  .bar.ur > i{background-color:#f43f5e;box-shadow:0 0 12px rgba(244,63,94,0.6);}
  .bar-row .num{width:90px;text-align:right;flex:none;color:#e2e8f0; font-weight:700;}
  .bar-row.warning .num { color: #f43f5e; font-weight: 800; animation: pulseWarn 1s infinite alternate;}
  @keyframes pulseWarn { from { opacity: 0.7; } to { opacity: 1; } }
  .guarantee{ font-size:14px;padding:14px 20px;border-radius:14px; background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.05); color:#cbd5e1; display:flex;align-items:center;gap:10px; font-weight:600; transition: all 0.3s;}
  .guarantee.on{ border-color:rgba(251,191,36,0.6);color:var(--primary);background:rgba(251,191,36,0.1); box-shadow: 0 0 20px rgba(251,191,36,0.2); }
  .rates-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 13px; color: #94a3b8; margin-top: 4px; font-weight: 500;}
  .rate-tag { padding: 6px 12px; border-radius: 8px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); font-weight: 700;}
  .rate-tag.N { color: var(--n); } .rate-tag.R { color: var(--r); } .rate-tag.SR { color: var(--sr); } .rate-tag.SSR { color: var(--ssr); } .rate-tag.UR { color: var(--ur); }
  #stage{ display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px; min-height:300px;align-content:start; background:rgba(5,10,20,0.4);border:1px dashed rgba(255,255,255,0.1); border-radius:24px;padding:24px;position:relative; box-shadow:inset 0 4px 20px rgba(0,0,0,0.4);}
  @media (max-width:759px){ #stage:not(.placeholder){ gap:8px; padding:12px 10px; } }
  #stage.placeholder{ display:flex;align-items:center;justify-content:center; color:#475569;font-size:15px; text-align:center; font-weight:600;}
  .card{
    --c:var(--n); position:relative; cursor:pointer; background:linear-gradient(160deg,rgba(40,50,80,0.6),rgba(15,20,40,0.9));
    border:1.5px solid var(--c);border-radius:20px; padding:24px 14px 18px;text-align:center;
    display: flex; flex-direction: column; align-items: center; animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;
    box-shadow: 0 10px 30px -5px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1); 
    transition: transform 0.3s cubic-bezier(0.2, 1.4, 0.4, 1), box-shadow 0.3s; 
    backdrop-filter: blur(8px);
  }
  .card:hover { transform: translateY(-8px) scale(1.04); box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 20px var(--c); z-index: 2;}
  .card::before{ content:"";position:absolute;inset:0; background:radial-gradient(circle at 50% -10%,var(--c),transparent 60%); opacity:.15;pointer-events:none;border-radius:18px; }
  .card.N{--c:var(--n);} .card.R{--c:var(--r);} .card.SR{--c:var(--sr);} .card.SSR{--c:var(--ssr);} .card.UR{--c:var(--ur);}
  .card-avatar { width: var(--card-avatar, 90px); height: var(--card-avatar, 90px);border-radius: 50%;display: flex; align-items: center; justify-content: center; margin-bottom: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.8), inset 0 0 0 2px rgba(255,255,255,0.15); border: 2px solid var(--c);position: relative; z-index: 1; overflow: hidden;background: #0e1324; }
  .card-avatar img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s;}
  .card:hover .card-avatar img { transform: scale(1.15); }
  .card-info { position: relative; z-index: 1; width: 100%; }
  .card .rarity{font-size:var(--card-rarity, 12px);letter-spacing:2px;color:var(--c);font-weight:900;}
  .card .cname{font-size:var(--card-name, 16px);font-weight:800;margin:6px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;}
  .card .cstars{font-size:var(--card-stars, 13px);color:var(--primary); letter-spacing:2px; margin-bottom:6px; height:18px;}
  .card .crace{font-size:var(--card-meta, 13px);color:#cbd5e1;margin-bottom:10px;font-weight:600;}
  .card .cstats { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px 8px; font-size: var(--card-stat, 13px); color: #fff; background: rgba(0,0,0,0.5); padding: 6px 0; border-radius: 10px; font-weight: 700; border: 1px solid rgba(255,255,255,0.05); }
  @keyframes pop{ 0%{opacity:0;transform:scale(.8) translateY(30px);} 100%{opacity:1;transform:scale(1) translateY(0);} }
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .actions.secondary{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;}
  button{ font-family:inherit;font-size:16px;cursor:pointer; border-radius:16px;padding:18px 20px; background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));color:#f1f5f9;border:1px solid rgba(255,255,255,0.15); transition:all .2s;font-weight:700; box-shadow:0 6px 15px rgba(0,0,0,0.3); position:relative; overflow:hidden;}
  button:hover:not(:disabled){background:linear-gradient(180deg,rgba(255,255,255,0.15),rgba(255,255,255,0.05));transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,0.4);} 
  button:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:grayscale(1);}
  #btnSingle, #btnTen{ background:linear-gradient(135deg,#f59e0b,#b45309); border:1.5px solid #fbbf24;color:#fff;font-size:20px;font-weight:900; box-shadow:0 10px 25px -5px rgba(245, 158, 11, 0.5); }
  #btnSingle small, #btnTen small{color:#fef3c7;font-weight:700;font-size:13px;display:block;margin-top:6px;}
  /* 战斗界面 */
  #battleStage { display: flex; flex-direction: column; gap: 16px; }
  .battle-teams { display: flex; flex-direction: column; gap: 16px; }
  .team-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 16px; border-radius: 16px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05);}
  .team-row.p-team { border-color: rgba(74,222,128,0.2); }
  .team-row.e-team { border-color: rgba(244,63,94,0.2); }
  .unit-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px; text-align: center; position: relative; transition: all 0.3s; cursor: pointer;}
  .unit-card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.1);}
  .unit-card img { width: 48px; height: 48px; border-radius: 50%; margin-bottom: 8px; border: 2px solid rgba(255,255,255,0.2); }
  .unit-card .u-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; color: #f1f5f9; }
  .unit-card .u-role { font-size: 10px; color: #94a3b8; margin-top: 4px; font-weight:600;}
  .hp-bar { height: 6px; background: rgba(0,0,0,0.6); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .hp-bar > div { height: 100%; background: linear-gradient(90deg, #22c55e, #4ade80); transition: width 0.3s; }
  .energy-bar { height: 4px; background: rgba(0,0,0,0.6); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .energy-bar > div { height: 100%; background: linear-gradient(90deg, #0ea5e9, #38bdf8); transition: width 0.3s; }
  .unit-card.dead { opacity: 0.3; filter: grayscale(1); cursor: default;}
  .unit-card.dead::after { content: "💀"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 32px; background: rgba(0,0,0,0.6); border-radius: 12px;}
  .unit-card.ultimate-ready { border-color: #fbbf24; box-shadow: 0 0 20px rgba(251,191,36,0.6); animation: pulseUlt 1s infinite alternate; }
  @keyframes pulseUlt { from { box-shadow: 0 0 10px rgba(251,191,36,0.3); } to { box-shadow: 0 0 25px rgba(251,191,36,1); } }
  .battle-log { height: 240px; overflow-y: auto; background: #050810; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px; font-size: 14px; line-height: 1.8; }
  .battle-log p { margin-bottom: 8px; font-weight: 500;}
  .log-p { color: #38bdf8; } .log-e { color: #f43f5e; } .log-heal { color: #4ade80; } .log-skill { color: #fbbf24; font-weight: 800;} 
  .log-sys { color: #64748b; text-align: center; margin: 12px 0; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 12px; font-weight: 800;}

  /* 模态框与数据中心 */
  .modal{ position:fixed;inset:0;z-index:50;display:none; align-items:center;justify-content:center;padding:20px; background:rgba(2,6,15,.8);backdrop-filter:blur(12px); }
  .modal.show{display:flex;}
  #unitModal{ z-index:55; }
  #unitModal .modal-box{ width:min(620px,100%); }
  .modal-box{ width:min(650px,100%);max-height:85vh;display:flex;flex-direction:column; background:linear-gradient(180deg, #1e293b, #0f172a);border:1px solid rgba(255,255,255,0.15); border-radius:28px;overflow:hidden;box-shadow:0 30px 60px -10px rgba(0,0,0,0.8); }
  .modal-box.wide { width: min(950px, 100%); }
  .modal-head{ display:flex;align-items:center;justify-content:space-between; padding:24px 28px;border-bottom:1px solid rgba(255,255,255,0.08); background:rgba(0,0,0,0.2); }
  .modal-head h3{font-size:20px;color:#fbbf24;font-weight:900;}
  #modalClose, #unitModalClose{ background:none;border:none;color:#94a3b8;font-size:24px; cursor:pointer; padding:0;}
  #modalClose:hover, #unitModalClose:hover{ color:#fff; background:none;}
  #modalBody{padding:28px;overflow-y:auto;font-size:15px;line-height:1.8;}

  /* Tab 切换 */
  .tabs { display: flex; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; }
  .tab-btn { padding: 8px 16px; font-size: 15px; color: #94a3b8; cursor: pointer; font-weight: 700; border-radius: 8px; transition: all 0.2s; }
  .tab-btn.active { background: rgba(251,191,36,0.15); color: #fbbf24; }
  
  /* 统计图表 */
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 16px; text-align: center; }
  .stat-box .s-label { font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight:600;}
  .stat-box .s-val { font-size: 22px; font-weight: 800; color: #fff; text-shadow:0 2px 10px rgba(255,255,255,0.2);}
  .stat-box .s-val.gold { color: #fbbf24; }
  
  /* 历史记录列表 */
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); border-radius: 10px; padding: 10px 16px; }
  .history-item .h-left { display: flex; align-items: center; gap: 10px; }
  .history-item .h-time { color: #64748b; font-size: 12px; }
  
  /* 图鉴筛选器与分页器 */
  .dex-filters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; position: sticky; top: -28px; background: #1e293b; padding: 14px 0; z-index: 10; border-bottom: 1px solid rgba(255,255,255,0.1);}
  .dex-filter-toggle { display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; cursor: pointer; padding: 10px 14px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; user-select: none; transition: background 0.2s; }
  .dex-filter-toggle:hover { background: rgba(255,255,255,0.08); }
  .dex-filter-toggle-title { font-size: 14px; font-weight: 800; color: #fbbf24; white-space: nowrap; }
  .dex-filter-summary { flex: 1; font-size: 12px; color: #94a3b8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dex-filter-arrow { color: #94a3b8; font-size: 12px; flex-shrink: 0; }
  .dex-filter-body { display: flex; gap: 12px 16px; flex-wrap: wrap; padding-top: 4px; }
  .dex-filter-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .dex-filter-label { font-size: 12px; color: #64748b; font-weight: 800; margin-right: 2px; white-space: nowrap; }
  .dex-race-tag { font-size: 10px; color: #94a3b8; background: rgba(0,0,0,0.35); padding: 1px 7px; border-radius: 99px; margin-top: 3px; }
  .dex-filter-btn { padding: 8px 16px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); font-size: 14px; cursor: pointer; color: #cbd5e1; font-weight:600; transition:all 0.2s;}
  .dex-filter-btn.active { background: linear-gradient(180deg,#fbbf24,#d97706); color: #000; font-weight: 800;}
  .dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 16px; }
  .dex-card { background: linear-gradient(180deg,rgba(255,255,255,0.05),rgba(255,255,255,0.01)); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; position: relative; cursor: pointer; }
  .dex-card:hover { transform:translateY(-4px); background:rgba(255,255,255,0.08); border-color:rgba(251,191,36,0.4);}
  .dex-card .mini-avatar { width: 60px; height: 60px; border-radius: 50%; margin-bottom: 8px; border: 2px solid rgba(255,255,255,0.15); overflow: hidden; }
  .dex-card .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .dex-card .d-name { font-size: 12px; font-weight: 700; text-align: center; color:#f1f5f9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%;}
  .dex-card .d-stars { font-size: 11px; color:#fbbf24; height:16px; margin:4px 0;}
  .dex-card .d-count { font-size: 12px; color: #cbd5e1; background: rgba(0,0,0,0.5); padding: 2px 10px; border-radius: 99px; font-weight:700;}
  .dex-card.locked { opacity: 0.5; cursor: default; }
  .dex-card.locked:hover { transform:none; border-color:rgba(255,255,255,0.08); }
  .dex-card.locked .mini-avatar { filter: grayscale(1) blur(1px); }

  .dex-pagination { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 32px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.08); }
  .dex-pagination button { padding: 10px 24px; font-size: 14px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: #f1f5f9; cursor: pointer; transition: 0.2s; font-weight: 700; }
  .dex-pagination button:hover:not(:disabled) { background: rgba(251,191,36,0.2); border-color: #fbbf24; color: #fbbf24; }
  .dex-pagination button:disabled { opacity: 0.3; cursor: not-allowed; }
  .dex-pagination span { font-size: 15px; color: #94a3b8; font-weight: 600; }

  .rule-title { color: #fbbf24; font-weight: 800; margin-top: 24px; margin-bottom: 12px; font-size: 18px; border-left:4px solid #fbbf24; padding-left:10px;}
  .rule-text { color: #cbd5e1; font-size: 14px; background:rgba(0,0,0,0.2); padding:16px; border-radius:12px; line-height:1.8;}
  .banner-list { display: flex; flex-direction: column; gap: 16px; }
  .banner-card { display: flex; align-items: center; gap: 20px; padding: 20px; border-radius: 20px; border: 2px solid transparent; background: rgba(255,255,255,0.03); cursor: pointer; transition: 0.2s;}
  .banner-card:hover { background: rgba(255,255,255,0.08); transform: scale(1.01);}
  .banner-card.current { border-color: #fbbf24; background: rgba(251,191,36,0.08); cursor: default;}
  .banner-icon { width: 70px; height: 70px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 36px; flex: none; }
  .banner-info { flex: 1; }
  .banner-info h4 { font-size: 18px; color: #f1f5f9; margin-bottom: 8px; font-weight:800;}
  .banner-up { display: flex; flex-wrap:wrap; gap: 8px; margin-top: 12px; }
  .up-mini { display: flex; align-items: center; gap: 6px; font-size: 13px; background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.1); font-weight:600;}
  .up-mini img { width: 24px; height: 24px; border-radius: 50%; }

  /* 🧺 分解与装备选择界面专用样式 */
  .sell-card { border: 2px solid rgba(255,255,255,0.08); cursor: pointer; transition: all 0.2s; }
  .sell-card:hover { background: rgba(244,63,94,0.1); border-color: rgba(244,63,94,0.5); }
  .sell-card.selected { border-color: #f43f5e; background: rgba(244,63,94,0.2); box-shadow: 0 0 15px rgba(244,63,94,0.3); }
  .sell-card.selected::after { content: "✓"; position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; background: #f43f5e; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; }
  .sell-bar { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: rgba(0,0,0,0.3); border-top: 1px solid rgba(255,255,255,0.08); position: sticky; bottom: 0; backdrop-filter: blur(10px); border-radius: 0 0 28px 28px; }

  /* 👕 装备槽界面 */
  .equip-slot { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px 16px; cursor: pointer; transition: 0.2s; margin-bottom: 8px;}
  .equip-slot:hover { background: rgba(255,255,255,0.08); border-color: #fbbf24; }
  .equip-slot .eq-icon { font-size: 28px; width: 40px; text-align: center; }
  .equip-slot .eq-info { flex: 1; }
  .equip-slot .eq-name { font-weight: 700; color: #f1f5f9; }
  .equip-slot .eq-stat { font-size: 12px; color: #4ade80; margin-top: 4px;}
  .equip-slot.empty { opacity: 0.5; border-style: dashed; }

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

  if (rarity === 'SSR' || rarity === 'UR') {
    const pool = rarity === 'SSR' ? (SSR_NAMES[race] || []) : (UR_NAMES[race] || []);
    for (const name of pool) {
      if (!usedNames.has(name)) { usedNames.add(name); return name; }

  const tier = NAME_TIERS[rarity] || NAME_TIERS.N;
  const corePool = tier.core === 'COMMON' ? RACE_CORE_COMMON[race] : tier.core === 'ELITE' ? RACE_CORE_ELITE[race] : RACE_CORE[race];
  while (true) {
    const core = _pickName(corePool);
    const pre = _pickName(tier.pre);
    const suf = tier.suf.length ? _pickName(tier.suf) : '';
    const p = tier.pattern[Math.floor(_nameRand() * tier.pattern.length)];
    let name;
    if (p === 1) name = core;
    else if (p === 2) name = pre + core;
    else if (p === 3) name = core + suf;
    else name = pre + core + suf;
    
    if (!usedNames.has(name)) { usedNames.add(name); return name; }
  }
}

function _registerChar(race, rarity) {

function getCharBaseStats(name, rarity) {
  let hash = 0; for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  hash = Math.abs(hash);
  const p = { N:[10,50,20], R:[40,200,40], SR:[100,600,100], SSR:[300,2000,200], UR:[800,5000,400] }[rarity] || [10,50,20];
  return { atk: p[0] + (hash % p[2]), hp: p[1] + (hash % (p[2] * 5)) };
}
function getRoleInfo(name, race) {
  if (/牧师|祭司|主教|天使|神使|神族|圣光/.test(name) || race === "神族") return { role: "治疗", icon: "💚" };
  if (/法师|术士|巫师|死灵|巫妖|咒术/.test(name)) return { role: "法师", icon: "💥" };
  if (/刺客|盗贼|游侠|弓手|猎手|暗杀/.test(name)) return { role: "刺客", icon: "🗡️" };
  if (/骑士|战士|步兵|角斗士|守卫|泰坦|狂战士|掠夺者/.test(name) || race === "兽人" || race === "矮人") return { role: "战士", icon: "🛡️" };
  return { role: "狂战士", icon: "⚔️" };
}
function getDamageMultiplier(atkR, defR) {
  if (COUNTERS[atkR]?.includes(defR)) return 1.5;
  if (COUNTERS[defR]?.includes(atkR)) return 0.75;
  return 1.0;
}
function pickWeighted(list) {
  const total = list.reduce((s, x) => s + x.w, 0);
  let roll = Math.random() * total;
  for (const x of list) { roll -= x.w; if (roll < 0) return x.r; }
  return list[list.length - 1].r;
}

function getSVGDataURL(race, name) {
  const key = `${race}_${name}`; if (svgCache.has(key)) return svgCache.get(key);
  let hash = 0; for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  hash = Math.abs(hash);
  const hue = hash % 360;
  const rarity = RARITY_MAP.get(name) || 'N';
  const rank = RARITY_ORDER[rarity] || 0;
  const st = SVG_RARITY_STYLE[rarity] || SVG_RARITY_STYLE.N;
  const bgDef = SVG_RACE_BG[race] || SVG_RACE_BG["人类"];
  const bgHue = (hue + bgDef.off) % 360;
  const bg1 = `hsl(${bgHue},${bgDef.s}%,${Math.min(56, bgDef.l1 + (rank >= 3 ? 4 : 0))}%)`;
  const bg2 = `hsl(${bgHue},${bgDef.s}%,${Math.max(6, bgDef.l2 - (rank >= 4 ? 2 : 0))}%)`;
  const icon = SVG_RACE_ICON[race] || SVG_RACE_ICON["人类"];

  // 确定性随机：只用于星尘位置，保证同一角色每次刷新一致
  let seed = (hash ^ 0x9e3779b9) >>> 0;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

  let rays = '';
  for (let i = 0; i < st.rays; i++) {
    const a = (i / st.rays) * Math.PI * 2 + 0.12;
    const x1 = 60 + Math.cos(a) * 32, y1 = 60 + Math.sin(a) * 32;
    const x2 = 60 + Math.cos(a) * 57, y2 = 60 + Math.sin(a) * 57;
    rays += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${st.accent}" stroke-width="${rank >= 3 ? 1 : 0.7}" opacity="${(0.10 + (i % 3) * 0.04).toFixed(2)}"/>`;
  }
  let ticks = '';
  for (let i = 0; i < st.ticks; i++) {
    const a = (i / st.ticks) * Math.PI * 2;
    const x1 = 60 + Math.cos(a) * 51.2, y1 = 60 + Math.sin(a) * 51.2;
    const x2 = 60 + Math.cos(a) * 54.2, y2 = 60 + Math.sin(a) * 54.2;
    ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${st.accent}" stroke-width="0.8" opacity="0.45"/>`;
  }
  let gems = '';
  for (let i = 0; i < st.gems; i++) {
    const a = (i / st.gems) * 360;
    const big = (rank >= 4 && i % 3 === 0);
    const d = big ? 'M60,1 L64,7 L60,13 L56,7 Z' : 'M60,3 L63,8 L60,13 L57,8 Z';
    gems += `<g transform="rotate(${a.toFixed(1)} 60 60)"><path d="${d}" fill="${st.accent}" stroke="#ffffff" stroke-width="0.7" opacity="0.95"/></g>`;
  }
  let sparks = '';
  for (let i = 0; i < st.sparks; i++) {
    const a = rnd() * Math.PI * 2, r = 34 + rnd() * 21;
    const x = 60 + Math.cos(a) * r, y = 60 + Math.sin(a) * r;
    const s = 0.8 + rnd() * 1.8;
    const o = (0.3 + rnd() * 0.55).toFixed(2);
    sparks += `<path d="M${x.toFixed(1)},${(y - s).toFixed(1)} L${(x + s * 0.28).toFixed(1)},${(y - s * 0.28).toFixed(1)} L${(x + s).toFixed(1)},${y.toFixed(1)} L${(x + s * 0.28).toFixed(1)},${(y + s * 0.28).toFixed(1)} L${x.toFixed(1)},${(y + s).toFixed(1)} L${(x - s * 0.28).toFixed(1)},${(y + s * 0.28).toFixed(1)} L${(x - s).toFixed(1)},${y.toFixed(1)} L${(x - s * 0.28).toFixed(1)},${(y - s * 0.28).toFixed(1)} Z" fill="#ffffff" opacity="${o}"/>`;
  }
  const crown = st.crown ? `<g><path d="M40,15 L45,4 L52,12 L60,2 L68,12 L75,4 L80,15 L76,21 L44,21 Z" fill="url(#gold)" stroke="#fff7cc" stroke-width="0.9"/><circle cx="60" cy="12" r="1.8" fill="#ffffff"/><circle cx="46" cy="17" r="1.1" fill="#ffffff"/><circle cx="74" cy="17" r="1.1" fill="#ffffff"/></g>` : '';
  const wings = st.wings ? `<g fill="none" stroke="#fde68a" stroke-width="1.6" opacity="0.5"><path d="M30,44 Q9,31 8,52 Q18,52 26,59"/><path d="M27,55 Q12,51 13,69 Q22,65 30,70"/><path d="M90,44 Q111,31 112,52 Q102,52 94,59"/><path d="M93,55 Q108,51 107,69 Q98,65 90,70"/></g>` : '';
  const halo = st.halo ? `<circle cx="60" cy="60" r="58" fill="none" stroke="#fde68a" stroke-width="1.1" stroke-dasharray="2 6" opacity="0.6"/>` : '';
  const dashed = rank >= 3 ? `<circle cx="60" cy="60" r="57.6" fill="none" stroke="${st.accent}" stroke-width="0.8" stroke-dasharray="1.5 4.5" opacity="0.55"/>` : '';

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><radialGradient id="bg" cx="50%" cy="28%" r="82%"><stop offset="0%" stop-color="${bg1}"/><stop offset="55%" stop-color="${bg2}"/><stop offset="100%" stop-color="#04060c"/></radialGradient><radialGradient id="vig" cx="50%" cy="48%" r="54%"><stop offset="55%" stop-color="#000000" stop-opacity="0"/><stop offset="100%" stop-color="#000000" stop-opacity="0.6"/></radialGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="${st.accent}" stop-opacity="0.5"/><stop offset="55%" stop-color="${st.accent}" stop-opacity="0.16"/><stop offset="100%" stop-color="${st.accent}" stop-opacity="0"/></radialGradient><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff7cc"/><stop offset="45%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#b45309"/></linearGradient></defs><rect width="120" height="120" fill="url(#bg)"/><path d="M-10,104 L52,-20 L82,-20 L20,124 Z" fill="rgba(255,255,255,0.045)"/>${wings}${rays}<rect width="120" height="120" fill="url(#vig)"/><circle cx="60" cy="60" r="38" fill="url(#glow)"/><circle cx="60" cy="60" r="28" fill="rgba(5,9,18,0.55)" stroke="${st.ring2}" stroke-width="1.2"/><g transform="translate(30,30)">${icon}</g>${dashed}<circle cx="60" cy="60" r="55" fill="none" stroke="${st.ring}" stroke-width="${st.ringW}"/><circle cx="60" cy="60" r="50" fill="none" stroke="${st.ring2}" stroke-width="1"/>${ticks}${gems}${crown}${sparks}${halo}</svg>`;
  const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  svgCache.set(key, url); return url;
}

  const TITLES = {
    SR:  ["无畏者","守望者","破晓之光","风之行者","沉默之刃","圣痕守护者","狂澜之心","边境之盾","暮色猎手","荒原之息"],

  const c = {
    name, race, role: role.role, land: lore.land, foe: lore.foe,
    craft: lore.craft, symbol: lore.symbol, trait: lore.trait,
    weapon: rl.weapon, deed: rl.deed, title: ''

  const title = ((rarity === 'SR' || rarity === 'SSR' || rarity === 'UR')

// 清洗存档中的无效角色名（历史版本/损坏存档导致的幽灵角色），避免“角色不可用”
function sanitizeCharKeys(obj) {
  const clean = Object.create(null);
  if (obj && typeof obj === 'object') {
    for (const k in obj) if (RARITY_MAP.has(k)) clean[k] = obj[k];
  }
  return clean;
}

class GameState {
  constructor() {
    this.total = 0; this.sinceSR = 0; this.sinceSSR = 0; this.sinceUR = 0;
    this.guaranteedSSR = false; this.guaranteedUR = false;
    this.stats = { N:0, R:0, SR:0, SSR:0, UR:0 };
    this.collection = Object.create(null); this.stars = Object.create(null);
    this.history = []; this.limitedCnt = 0; this.standardCnt = 0; this.best = null;
    this.coins = CONFIG.INITIAL_COINS; this.workLeft = CONFIG.WORK_MAX;
    this.freePulls = CONFIG.FREE_PULLS_INITIAL;
    this.earned = 0; this.spent = 0; this.bannerIndex = 0; this.towerLevel = 1;
    this.playerTeam = [null, null, null, null, null, null];
    
    this.inventory = []; 
    this.equipment = Object.create(null); 
  }
  get banner() { return BANNERS[this.bannerIndex]; }
  switchBanner(index) {
    if (index === this.bannerIndex || index < 0 || index >= BANNERS.length) return false;
    this.bannerIndex = index; return true;
  }
  hydrate(d) {
    if (!d || typeof d !== 'object') return false;
    const n = (v, fb) => (typeof v === 'number' && isFinite(v) && v >= 0) ? v : fb;
    const o = (v, fb) => (v && typeof v === 'object') ? v : fb;
    const legacy = (typeof d.v === 'number') && d.v < 8;
    this.total = n(d.total, 0); this.sinceSR = n(d.sinceSR, 0); this.sinceSSR = n(d.sinceSSR, 0); this.sinceUR = n(d.sinceUR, 0);
    this.guaranteedSSR = !!d.guaranteedSSR; this.guaranteedUR = !!d.guaranteedUR; this.stats = o(d.stats, { N:0,R:0,SR:0,SSR:0,UR:0 });
    this.limitedCnt = n(d.limitedCnt, 0); this.standardCnt = n(d.standardCnt, 0);
    this.coins = n(d.coins, CONFIG.INITIAL_COINS); this.workLeft = n(d.workLeft, CONFIG.WORK_MAX);
    this.freePulls = (typeof d.freePulls === 'number' && isFinite(d.freePulls) && d.freePulls >= 0) ? d.freePulls : 0;
    this.earned = n(d.earned, 0); this.spent = n(d.spent, 0);
    this.bannerIndex = (typeof d.bannerIndex === 'number' && d.bannerIndex >= 0 && d.bannerIndex < BANNERS.length) ? d.bannerIndex : 0;
    this.towerLevel = Math.min(n(d.towerLevel, 1) || 1, CONFIG.TOWER_MAX_LEVEL + 1);
    this.inventory = Array.isArray(d.inventory) ? d.inventory : [];

    if (legacy) {
      this._migrateLegacy(d);
    } else {
      this.collection = sanitizeCharKeys(d.collection); this.stars = sanitizeCharKeys(d.stars);
      // 清除空角色：删除数量为 0 的残留条目
      for (const k in this.collection) if (!(this.collection[k] > 0)) delete this.collection[k];
      this.history = Array.isArray(d.history) ? d.history : [];
      this.best = d.best || null;
      this.playerTeam = (Array.isArray(d.playerTeam) ? d.playerTeam : []).map(c => (typeof c === 'string' && RARITY_MAP.has(c)) ? c : null).slice(0, 6);
      while (this.playerTeam.length < 6) this.playerTeam.push(null);
      this.equipment = sanitizeCharKeys(d.equipment);
    }
    return true;
  }
  _migrateLegacy(d) {
    // 旧版角色名序列已随名字分层规则失效：按稀有度补发等量新角色，保留非角色进度与背包
    const nameToRarity = new Map();
    const hist = Array.isArray(d.history) ? d.history : [];
    for (const h of hist) {
      if (h && h.char && h.rarity) {
        const cur = nameToRarity.get(h.char);
        if (!cur || RARITY_ORDER[h.rarity] > RARITY_ORDER[cur]) nameToRarity.set(h.char, h.rarity);
      }
    }
    const counts = { N:0, R:0, SR:0, SSR:0, UR:0 };
    const oldColl = (d.collection && typeof d.collection === 'object') ? d.collection : {};
    for (const name in oldColl) {
      if (!(oldColl[name] > 0)) continue;
      const rar = nameToRarity.get(name) || 'N';
      counts[rar]++;
    }
    // 旧角色穿戴中的装备退回背包
    const oldEquip = (d.equipment && typeof d.equipment === 'object') ? d.equipment : {};
    for (const name in oldEquip) {
      const slots = oldEquip[name];
      if (slots && typeof slots === 'object') {
        for (const type in slots) { const eq = slots[type]; if (eq) this.inventory.push(eq); }
      }
    }
    // 重置角色相关状态
    this.collection = Object.create(null);
    this.stars = Object.create(null);
    this.equipment = Object.create(null);
    this.playerTeam = [null, null, null, null, null, null];
    this.history = [];
    this.best = null;
    // 按稀有度补发新角色（去重种数等量，每角色 1 张）
    for (const rar of RARITY_LIST) {
      const need = counts[rar] || 0;
      const pool = CHARACTERS[rar];
      const chosen = new Set();
      let guard = 0;
      while (chosen.size < need && guard++ < need * 20 + 200) {
        chosen.add(pickRandom(pool));
      }
      for (const name of chosen) this.collection[name] = 1;
    }
  }
  serialize() {
    return JSON.stringify({
      v: 8, total: this.total, sinceSR: this.sinceSR, sinceSSR: this.sinceSSR, sinceUR: this.sinceUR,
      guaranteedSSR: this.guaranteedSSR, guaranteedUR: this.guaranteedUR, stats: this.stats, collection: this.collection,
      stars: this.stars, history: this.history.slice(-500), limitedCnt: this.limitedCnt,
      standardCnt: this.standardCnt, best: this.best, coins: this.coins,
      freePulls: this.freePulls,
      workLeft: this.workLeft, earned: this.earned, spent: this.spent,
      bannerIndex: this.bannerIndex, towerLevel: this.towerLevel, playerTeam: this.playerTeam,
      inventory: this.inventory, equipment: this.equipment
    });
  }
}

const g = new GameState();
let _saveTimer = null, _lastSaveTime = 0, _resetFlag = false;

function saveGame() {
  const now = Date.now(), wait = CONFIG.SAVE_THROTTLE_MS - (now - _lastSaveTime);
  if (wait <= 0) {
    _lastSaveTime = now; clearTimeout(_saveTimer);
    safeSetItem(CONFIG.SAVE_KEY, g.serialize());
  } else {
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(() => { _lastSaveTime = Date.now(); safeSetItem(CONFIG.SAVE_KEY, g.serialize()); }, wait);
  }
}
function loadGame() {
  const raw = safeGetItem(CONFIG.SAVE_KEY); if (!raw) return false;
  try { return g.hydrate(JSON.parse(raw)); } catch (e) { return false; }
}
window.addEventListener('beforeunload', () => { if (_resetFlag) return; clearTimeout(_saveTimer); safeSetItem(CONFIG.SAVE_KEY, g.serialize()); });

   7. 装备、抽卡与升星
   ============================================================ */
let _eqIdSeq = 0; // 装备 id 自增序号，保证同一毫秒内多件装备 id 唯一
function generateEquipment(level) {
  const rarities = level < 5 ? ['N','R','SR'] : level < 10 ? ['R','SR','SSR'] : ['SR','SSR','UR'];
  const rarity = pickRandom(rarities);
  const type = pickRandom(EQUIP_TYPES);
  const race = pickRandom(RACES);
  const name = EQUIP_NAMES[type][race];
  
  // 装备只按「品质 × 层数」生成基础值，本族专属加成在穿戴时按角色种族动态计算
  const mult = EQUIP_RARITY_MULT[rarity] * (1 + (level - 1) * 0.2);
  
  let baseAtk = 0, baseHp = 0;
  if (type === '武器') baseAtk = 20;
  else if (type === '护甲' || type === '裤子') baseHp = 100;
  else { baseAtk = 5; baseHp = 30; }
  
  return {
    id: `${Date.now()}-${(++_eqIdSeq)}-${Math.random().toString(36).slice(2, 6)}`,
    type, rarity, race, name: `${rarity}·${name}`,
    atk: Math.floor(baseAtk * mult),
    hp: Math.floor(baseHp * mult)
  };
}

function getEquipmentStats(name) {
  const eqs = g.equipment[name] || {};
  const charRace = RACE[name];
  let atk = 0, hp = 0;
  for (const type of EQUIP_TYPES) {
    const eq = eqs[type];
    if (eq) {
      const bonus = (eq.race && charRace && eq.race === charRace) ? EQUIP_RACE_BONUS : 1;
      atk += Math.floor(eq.atk * bonus);
      hp += Math.floor(eq.hp * bonus);
    }
  }
  return { atk, hp };
}

function getFinalStats(name, rarity) {
  const base = getCharBaseStats(name, rarity);
  const starsMult = 1 + getCharStars(name) * 0.2;
  const equip = getEquipmentStats(name);
  return { 
    atk: Math.floor(base.atk * starsMult) + equip.atk, 
    hp: Math.floor(base.hp * starsMult) + equip.hp 
  };
}

function getCharStars(name) { return g.stars[name] || 0; }

function prepareUnit(name, isEnemy, multiplier = 1) {
  const rarity = RARITY_MAP.get(name) || 'N'; const race = RACE[name] || '人类';
  const stats = isEnemy ? getCharBaseStats(name, rarity) : getFinalStats(name, rarity);
  const roleInfo = getRoleInfo(name, race);
  return { name, rarity, race, ...roleInfo, atk: Math.floor(stats.atk * multiplier), maxHp: Math.floor(stats.hp * multiplier), hp: Math.floor(stats.hp * multiplier), energy: 0, isDead: false, isEnemy };
}

function _pickGold(rarity) {
  const upPool = g.banner.limited[rarity];
  if (upPool.length === 0) return [pickRandom(CHARACTERS[rarity]), false];
  const isUR = rarity === 'UR';
  if (isUR ? g.guaranteedUR : g.guaranteedSSR) {
    if (isUR) g.guaranteedUR = false; else g.guaranteedSSR = false;
    return [pickRandom(upPool), true];
  }
  if (Math.random() < 0.5) return [pickRandom(upPool), true];
  if (isUR) g.guaranteedUR = true; else g.guaranteedSSR = true;
  const allUP = new Set(BANNERS.flatMap(b => b.limited[rarity]));
  const standardPool = CHARACTERS[rarity].filter(c => !allUP.has(c));
  return [pickRandom(standardPool.length ? standardPool : CHARACTERS[rarity]), false];
}

function _doRoll() {
  g.total++; g.sinceSR++; g.sinceSSR++; g.sinceUR++;
  let rarity;
  if (g.sinceUR >= CONFIG.PITY_UR) rarity = 'UR';
  else if (g.sinceSSR >= CONFIG.PITY_SSR) rarity = pickWeighted([{r:"SSR",w:98},{r:"UR",w:2}]);
  else if (g.sinceSR >= CONFIG.PITY_SR) rarity = pickWeighted([{r:"SR",w:95},{r:"SSR",w:4.8},{r:"UR",w:0.2}]);
  else rarity = pickWeighted(POOL);
  if (RARITY_ORDER[rarity] >= RARITY_ORDER.SR) g.sinceSR = 0;
  if (RARITY_ORDER[rarity] >= RARITY_ORDER.SSR) g.sinceSSR = 0;
  if (rarity === 'UR') g.sinceUR = 0;

  let char, limited = false;
  if (rarity === "SSR" || rarity === "UR") {
    [char, limited] = _pickGold(rarity); limited ? g.limitedCnt++ : g.standardCnt++;
  } else { char = pickRandom(CHARACTERS[rarity]); }

  g.stats[rarity]++;
  g.collection[char] = (g.collection[char] || 0) + 1;
  g.history.push({ t: Date.now(), rarity, char, limited, banner: g.banner.name });
  if (g.history.length > CONFIG.HISTORY_MAX) g.history = g.history.slice(-CONFIG.HISTORY_MAX);
  const res = { rarity, char, limited };
  if (!g.best || RARITY_ORDER[rarity] > RARITY_ORDER[g.best.rarity]) g.best = res;
  return res;
}

function rollOne() {
  if (g.freePulls > 0) { g.freePulls--; }
  else {
    if (g.coins < CONFIG.PRICE_SINGLE) return { error: '金币不足！' };
    g.coins -= CONFIG.PRICE_SINGLE; g.spent += CONFIG.PRICE_SINGLE;
  }
  return { result: _doRoll() };
}
function rollTen() {
  const free = Math.min(g.freePulls, 10);
  const paid = 10 - free;
  const cost = paid * CONFIG.PRICE_SINGLE;
  if (g.coins < cost) return { error: '金币不足！' };
  g.freePulls -= free;
  g.coins -= cost; g.spent += cost;
  const results = []; for (let i = 0; i < 10; i++) results.push(_doRoll());
  return { results };
}

function work() {
  if (g.workLeft <= 0) return { error: '今日打工次数已用完' };
  g.workLeft--;
  const gain = Math.floor(Math.random() * (CONFIG.WORK_MAX_COIN - CONFIG.WORK_MIN_COIN + 1)) + CONFIG.WORK_MIN_COIN;
  g.coins += gain; g.earned += gain;
  return { gain };
}

function upgradeStar(name, rarity) {
  const cur = getCharStars(name); if (cur >= 5) return toast('已经满星！');
  const need = cur + 1; const have = (g.collection[name] || 0) - 1;
  if (have < need) return toast(`升星需要 ${need} 张材料，当前不足`);
  g.collection[name] -= need; g.stars[name] = cur + 1;
  toast(`✨ 升星成功！当前 ${g.stars[name]} 星`); saveGame(); refreshCharPanel(name, rarity);
}
function autoUpgradeStar(name, rarity) {
  let cur = getCharStars(name), upgraded = false;
  while (cur < 5) {
    const need = cur + 1;
    if ((g.collection[name] || 0) - 1 < need) break;
    g.collection[name] -= need; cur++; g.stars[name] = cur; upgraded = true;
  }
  if (upgraded) { toast(`✨ 一键升星完成！当前 ${cur} 星`); saveGame(); refreshCharPanel(name, rarity); }
  else toast('材料不足，无法升星');
}

   ============================================================ */
let battleState = null;

function autoFillTeam() {
  const owned = Object.keys(g.collection).filter(n => g.collection[n] > 0);
  owned.sort((a, b) => {
    const sA = getFinalStats(a, RARITY_MAP.get(a));
    const sB = getFinalStats(b, RARITY_MAP.get(b));
    return (sB.atk + sB.hp/5) - (sA.atk + sA.hp/5);
  });
  const inTeam = new Set(g.playerTeam.filter(n => n && owned.includes(n)));
  const fillers = owned.filter(n => !inTeam.has(n));
  for (let i = 0; i < 6; i++) {
    if (!g.playerTeam[i] || !owned.includes(g.playerTeam[i])) {
      if (fillers.length > 0) g.playerTeam[i] = fillers.shift();
      else g.playerTeam[i] = null;
    }
  }
}

/* 敌人强化倍率：分段递减增长率，前期成长快、后期收敛，避免线性数值爆炸 */
/* 敌人强化倍率：231 层前固定 ×1；231 层起敌方全 UR 阵容，倍率才逐步提升，最高 ×3 */
const TOWER_ALL_UR_LEVEL = 231;
function getEnemyMult(level) {
  if (level < TOWER_ALL_UR_LEVEL) return 1;
  const capped = Math.min(level, CONFIG.TOWER_MAX_LEVEL);
  const span = Math.max(1, CONFIG.TOWER_MAX_LEVEL - TOWER_ALL_UR_LEVEL);
  return Math.min(3, 1 + (capped - TOWER_ALL_UR_LEVEL) * (2 / span));
}

function getEnemyTeam(level) {
  const team = [];
  let rarities;
  if (level <= 5) rarities = ['N', 'N', 'R'];
  else if (level <= 15) rarities = ['R', 'R', 'SR'];
  else if (level <= 40) rarities = ['SR', 'SR', 'SSR'];
  else if (level <= 80) rarities = ['SSR', 'SSR', 'SSR', 'UR'];
  else if (level <= 150) rarities = ['SSR', 'SSR', 'UR'];
  else if (level < TOWER_ALL_UR_LEVEL) rarities = ['SSR', 'UR', 'UR'];
  else rarities = ['UR']; // 231 层起：全 UR 阵容，此时才开始提升强化倍率
  const mult = getEnemyMult(level);
  // 前期敌人数量更少：3 → 4 → 5 → 6，降低开荒压力
  const count = level <= 3 ? 3 : level <= 8 ? 4 : level <= 20 ? 5 : 6;
  for (let i = 0; i < count; i++) team.push(prepareUnit(pickRandom(CHARACTERS[pickRandom(rarities)]), true, mult));
  return team;
}

/* 通关奖励：层数越高效益越高（每 10 层系数 +10%） */
function getTowerReward(level) {
  return Math.floor(CONFIG.TOWER_REWARD_PER_LEVEL * (1 + 0.1 * Math.floor((level - 1) / 10)));
}
/* 实际奖励：以标准值为基准随机浮动 ±20%，再乘以首通/重复系数 */
function rollTowerReward(level, firstClear) {
  const base = getTowerReward(level);
  const variance = 0.8 + Math.random() * 0.4; // 0.8 ~ 1.2
  return Math.floor(base * variance * (firstClear ? 2 : 0.5));
}
/* 掉落件数：高层保底更多 */
function getTowerDropCount(level) {
  let n = Math.random() < 0.3 ? 2 : 1;
  if (level >= 25) n = Math.max(n, 3);
  else if (level >= 10) n = Math.max(n, 2);
  return n;
}
/* 难度分级（选关界面展示） */
function getLevelGrade(level) {
  if (level <= 5) return { grade: '入门', color: '#94a3b8' };
  if (level <= 15) return { grade: '进阶', color: '#4ade80' };
  if (level <= 40) return { grade: '困难', color: '#38bdf8' };
  if (level <= 80) return { grade: '精英', color: '#fbbf24' };
  if (level <= 150) return { grade: '噩梦', color: '#fb7185' };
  if (level <= 230) return { grade: '深渊', color: '#e879f9' };
  return { grade: '炼狱', color: '#f43f5e' };
}

function _renderUnitCard(u, side, idx) {
  const click = side === 'p'
    ? `onclick="onPlayerCardClick('${u.name}', '${u.rarity}', ${idx})" title="点击查看角色面板；能量满时释放大招"`
    : `onclick="showBattleUnitPanel('e', ${idx})" title="点击查看敌方面板（战斗自动暂停）"`;

}

function renderBattleUI(pTeam, eTeam, level) {

function appendLog(html) { const log = $('battleLog'); if (log) { log.insertAdjacentHTML('beforeend', html); log.scrollTop = log.scrollHeight; } }
function _unitEl(u, isEnemy) { return document.getElementById(`${isEnemy?'e':'p'}-${u.name.replace(/\s/g,'')}`); }
function animateHit(u, isEnemy) { const el = _unitEl(u, isEnemy); if (el) { el.style.transform = 'scale(0.9)'; setTimeout(() => el.style.transform = 'scale(1)', 150); } }
function updateHpBar(u, isEnemy) {
  const el = _unitEl(u, isEnemy); if (!el) return;
  el.querySelector('.hp-bar > div').style.width = clamp((u.hp / u.maxHp) * 100, 0, 100) + '%';
  el.querySelector('.energy-bar > div').style.width = clamp(u.energy, 0, 100) + '%';
  el.classList.toggle('dead', u.isDead); el.classList.toggle('ultimate-ready', !isEnemy && !u.isDead && u.energy >= 100);
}

window.setBattleSpeed = (s) => { if (battleState) battleState.speed = s; toast(`战斗速度: ${s}x`); };
// 点击我方角色卡：能量满则释放大招，否则打开装备界面
window.onPlayerCardClick = (name, rarity, idx) => {
  const bs = battleState;
  if (!bs || !bs.active) return;
  const u = bs.pTeam ? bs.pTeam[idx] : null;
  if (!u) return;
  if (!u.isDead && u.energy >= 100) { triggerUltimate('p', idx); return; }
  showBattleUnitPanel('p', idx);
};
function pauseBattle() {
  if (!battleState || !battleState.active || battleState.paused) return;
  battleState.paused = true;
  if (battleState._pause) battleState._pause();
}
function resumeBattle() {
  if (!battleState || !battleState.active || !battleState.paused) return;
  battleState.paused = false;
  if (battleState._resume) battleState._resume();
}
window.triggerUltimate = (side, idx) => {
  if (!battleState || !battleState.active || side !== 'p') return;
  const u = battleState.pTeam[idx]; if (!u || u.isDead || u.energy < 100) return;
  u.energy = 0; updateHpBar(u, false); const enemies = battleState.eTeam.filter(e => !e.isDead);
  appendLog(`<p class="log-skill" style="text-align:center;font-size:16px;">✨ ${u.name} 释放了终极奥义！</p>`);
  if (u.role === '治疗') {
    const heal = Math.floor(u.atk * 4);
    battleState.pTeam.forEach(p => { if (!p.isDead) { p.hp = Math.min(p.maxHp, p.hp + heal); updateHpBar(p, false); } });
    appendLog(`<p class="log-heal">我方全体恢复了 ${heal} 生命！</p>`);
  } else if (u.role === '法师') {
    enemies.forEach(e => { const dmg = Math.floor(u.atk * 2.5); e.hp -= dmg; animateHit(e, true); updateHpBar(e, true); if (e.hp <= 0) e.isDead = true; });
    appendLog(`<p class="log-p">对敌方全体造成了 AOE 法术伤害！</p>`);
  } else {
    const target = pickRandom(enemies);
    if (target) {
      const dmg = Math.floor(u.atk * 5); target.hp -= dmg; animateHit(target, true); updateHpBar(target, true);
      appendLog(`<p class="log-p">对 ${target.name} 造成了 <b>${dmg}</b> 点致命斩杀！</p>`);
      if (target.hp <= 0) target.isDead = true;
    }
  }
};

function stopBattle() {
  if (!battleState) return;
  battleState.active = false;
  battleState.paused = false;
  const um = $('unitModal'); if (um) um.classList.remove('show');
  if (battleState.timer) { clearTimeout(battleState.timer); battleState.timer = null; }
  const cancel = battleState.cancel;
  battleState.cancel = null;
  if (cancel) cancel();
}

function showBattleResult(win, level, rewardCoins, drops, firstClear, isFinalClear) {
  const stage = $('battleStage'); if (!stage) return;
  const old = $('battleResult'); if (old) old.remove();
  const div = document.createElement('div');
  div.id = 'battleResult'; div.className = 'battle-result' + (win ? '' : ' lose');
  const dropText = drops && drops.length
    ? `<div style="margin-top:10px;font-size:14px;color:#38bdf8;">🎁 掉落：${drops.map(d=>`<span class="eq-rarity-${d.rarity}">${d.name}</span>`).join('、')}</div>`
    : '';
  const bonusText = win ? (firstClear
    ? ` <span style="font-size:12px;color:#4ade80;background:rgba(74,222,128,0.15);padding:2px 8px;border-radius:6px;">首通 ×2.0</span>`
    : ` <span style="font-size:12px;color:#94a3b8;background:rgba(148,163,184,0.15);padding:2px 8px;border-radius:6px;">重复挑战 ×0.5</span>`) : '';
  let title, actions;
  if (win) {
    if (isFinalClear) {
      title = `🎉 通关全部 ${CONFIG.TOWER_MAX_LEVEL} 层！试炼之塔已被征服！`;
      actions = `<button class="primary" onclick="retryFloor()">🔁 再打一次第 ${level} 层</button>`;
    } else {
      title = `🏆 第 ${level} 层挑战成功！${firstClear ? '🔓 已解锁下一层' : ''}`;
      actions = `<button class="primary" onclick="goNextFloor()">▶ 下一关（第 ${level + 1} 层）</button><button onclick="retryFloor()">🔁 再打一次本层</button>`;
    }
  } else {
    title = `💀 第 ${level} 层挑战失败`;
    actions = `<button class="primary" onclick="retryFloor()">🔄 重试本关</button>`;
  }
  div.innerHTML = `<h3>${title}</h3>
    <div style="font-size:14px;color:#cbd5e1;">${win ? `获得 <b style="color:#fbbf24">${rewardCoins}</b> 金币${bonusText}${dropText}` : '试试调整阵容、升星或穿戴装备后再次挑战'}</div>
    <div class="result-actions">
      ${actions}
      <button onclick="openTowerSelect()">🗺️ 选择关卡</button>
      <button onclick="openTeamEditor(true)">👥 编辑阵容</button>
    </div>`;
  stage.appendChild(div);
}

async function startBattle(pTeam, eTeam, level) {
  const state = { pTeam, eTeam, level, speed: 1, active: true, paused: false, timer: null, cancel: null, _pause: null, _resume: null };
  battleState = state;
  let round = 1;
  const sleep = ms => new Promise(res => {
    let remaining = ms, startedAt = null, timer = null, done = false;
    const finish = () => {
      if (done) return; done = true;
      if (timer) { clearTimeout(timer); timer = null; }
      state.timer = null; state.cancel = null; state._pause = null; state._resume = null;
      res();
    };
    const arm = () => {
      if (done || state.paused) { startedAt = null; return; }
      startedAt = Date.now();
      timer = setTimeout(finish, Math.max(0, remaining / state.speed));
      state.timer = timer;
    };
    state.cancel = finish;
    state._pause = () => {
      if (done) return;
      if (timer) { clearTimeout(timer); timer = null; state.timer = null; }
      if (startedAt !== null) { remaining = Math.max(0, remaining - (Date.now() - startedAt)); startedAt = null; }
    };
    state._resume = () => { if (!done && !state.paused) arm(); };
    arm();
  });
  const step = async () => {
    if (!state.active) return;
    if (pTeam.every(u => u.isDead)) { state.active = false; appendLog(`<p class="log-sys" style="color:#f43f5e">💀 战斗失败！</p>`); showBattleResult(false, level, 0, []); return; }
    if (eTeam.every(u => u.isDead)) {
      state.active = false;
      const firstClear = level >= g.towerLevel;
      const rewardCoins = rollTowerReward(level, firstClear);
      g.coins += rewardCoins; g.earned += rewardCoins;

      const dropCount = getTowerDropCount(level);
      let drops = [];
      for(let i=0; i<dropCount; i++) {
         const eq = generateEquipment(level);
         g.inventory.push(eq);
         drops.push(eq);
      }

      appendLog(`<p class="log-sys" style="color:#fbbf24">✨ 胜利！获得 ${rewardCoins} 金币（${firstClear ? '首通 ×2.0' : '重复挑战 ×0.5'}）！</p>`);
      if (drops.length > 0) {
         appendLog(`<p class="log-sys" style="color:#38bdf8">🎁 获得装备：${drops.map(d=>`<span class="eq-rarity-${d.rarity}">${d.name}</span>`).join("、")}</p>`);
      }

      const isFinalClear = firstClear && level >= CONFIG.TOWER_MAX_LEVEL;
      g.towerLevel = Math.max(g.towerLevel, level + 1); saveGame(); renderStatus(); showBattleResult(true, level, rewardCoins, drops, firstClear, isFinalClear); return;
    }
    appendLog(`<p class="log-sys">—— 第 ${round} 回合 ——</p>`);
    const allUnits = [...pTeam.filter(u => !u.isDead).map(u => ({ unit: u, side: 'p' })), ...eTeam.filter(u => !u.isDead).map(u => ({ unit: u, side: 'e' }))].sort((a, b) => b.unit.atk - a.unit.atk);
    for (const entry of allUnits) {
      if (!state.active) break;
      const u = entry.unit; if (u.isDead) continue;
      const enemies = entry.side === 'p' ? eTeam : pTeam; const aliveEnemies = enemies.filter(e => !e.isDead);
      if (aliveEnemies.length === 0) break;
      const target = pickRandom(aliveEnemies); const mult = getDamageMultiplier(u.race, target.race);
      const dmg = Math.floor(u.atk * (0.8 + Math.random() * 0.4) * mult);
      target.hp -= dmg; target.energy = Math.min(100, target.energy + 30); u.energy = Math.min(100, u.energy + 25);
      animateHit(target, target.isEnemy);
      const cls = entry.side === 'p' ? 'log-p' : 'log-e'; const prefix = entry.side === 'p' ? '🛡️' : '👹';
      appendLog(`<p class="${cls}">${prefix} ${u.name} 对 ${target.name} 造成 <b>${dmg}</b> 伤害${mult > 1 ? ' <span style="color:#fbbf24">【克制】</span>' : ''}</p>`);
      if (target.hp <= 0) { target.hp = 0; target.isDead = true; appendLog(`<p>${target.name} 倒下。</p>`); }
      updateHpBar(target, target.isEnemy); updateHpBar(u, u.isEnemy);
      await sleep(CONFIG.BATTLE_SPEED_BASE);
    }
    round++; if (state.active) step();
  };
  step();
}

/* —— 试炼之塔：关卡选择 / 阵容编辑 / 开战 —— */
const towerState = { selectedLevel: 1 };
const teamState = { slot: 0, fromBattle: false };
let equipReturnToTeam = false; // 从阵容编辑器进入装备界面时置位，穿戴完成后返回阵容

function openBattle() { openTowerSelect(); }

function openTowerSelect() {
  stopBattle();
  towerState.selectedLevel = Math.max(1, g.towerLevel);
  renderTowerSelect();
}

function renderTowerSelect() {
  const cleared = Math.min(Math.max(0, g.towerLevel - 1), CONFIG.TOWER_MAX_LEVEL);
  const unlockedMax = Math.min(g.towerLevel, CONFIG.TOWER_MAX_LEVEL);
  const from = Math.max(1, unlockedMax - 14);
  const to = Math.min(unlockedMax + 4, CONFIG.TOWER_MAX_LEVEL);
  let levelsHTML = '';
  for (let lv = from; lv <= to; lv++) {
    if (lv <= unlockedMax) {
      const isCleared = lv <= cleared;
      const isCurrent = lv === unlockedMax;
      const isActive = lv === towerState.selectedLevel;
      levelsHTML += `<div class="tower-level ${isActive ? 'active' : ''} ${isCleared ? 'cleared' : ''} ${isCurrent ? 'current' : ''}" onclick="selectTowerLevel(${lv})">${lv}</div>`;
    } else {
      levelsHTML += `<div class="tower-level locked" onclick="toast('🔒 第 ${lv} 层尚未解锁，需先通关第 ${unlockedMax} 层')">${lv}</div>`;
    }
  }
  const sel = Math.max(1, Math.min(towerState.selectedLevel, unlockedMax));
  if (sel !== towerState.selectedLevel) towerState.selectedLevel = sel;
  const gradeInfo = getLevelGrade(sel);
  const enemyMult = getEnemyMult(sel).toFixed(2);
  const reward = getTowerReward(sel);
  const firstClear = sel >= unlockedMax;
  const actualReward = firstClear ? reward * 2 : Math.floor(reward * 0.5);
  const dropHint = sel >= 25 ? '保底 3 件' : sel >= 10 ? '保底 2 件' : '1~2 件';
  const teamNames = g.playerTeam.filter(Boolean);
  const teamPreview = teamNames.length
    ? teamNames.map(n => `<img src="${getSVGDataURL(RACE[n] || '人类', n)}" style="width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,0.25);" title="${n}"/>`).join(' ')
    : '<span style="color:#64748b;">（空，开战时自动编队）</span>';
  const clearBadge = g.towerLevel > CONFIG.TOWER_MAX_LEVEL ? ' <span style="color:#fbbf24;">🎉 全塔通关</span>' : '';
  const html = `<div class="tower-progress"><div>🗼 已通关层数</div><b>${cleared} 层${clearBadge}</b><div>🔓 解锁上限：第 ${unlockedMax} 层</div></div>
    <div class="tower-info">
      <div><span>难度</span><b style="color:${gradeInfo.color};">${gradeInfo.grade}</b></div>
      <div><span>敌人强化</span><b style="color:#f43f5e;">×${enemyMult}</b></div>
      <div><span>通关奖励</span><b style="color:#fbbf24;">💰 ${actualReward} <small style="color:${firstClear ? '#4ade80' : '#94a3b8'};">${firstClear ? '首通 ×2.0' : '重复 ×0.5'}</small></b></div>
      <div><span>装备掉落</span><b style="color:#38bdf8;">${dropHint}</b></div>
    </div>
    <div style="font-size:12px;color:#94a3b8;margin:-4px 0 12px;line-height:1.7;">⚖️ 231 层前敌人强化固定 <b style="color:#cbd5e1;">×1</b>；231 层起敌方为全 UR 阵容，强化倍率开始提升，最高 <b style="color:#f43f5e;">×3</b>。</div>
    <div class="team-editor-tip">关卡需逐层解锁：<span style="color:#4ade80;">✓</span> 已通关可反复挑战刷奖励，<span style="color:#fbbf24;">虚线框</span> 为当前待通关层，🔒 为未解锁；也可输入已解锁层数直达。</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px;">${teamPreview}</div>
    <div class="tower-input-row"><input type="number" id="towerLevelInput" min="1" max="${unlockedMax}" value="${sel}" placeholder="层数"/><button onclick="jumpToLevel()">前往该层</button></div>
    <div class="tower-levels">${levelsHTML}</div>
    <div class="tower-actions">
      <button style="background:linear-gradient(135deg,#f59e0b,#b45309);border:1.5px solid #fbbf24;color:#fff;" onclick="startSelectedFloor()">⚔️ 开始挑战 第 ${sel} 层</button>
      <button onclick="openTeamEditor(false)">👥 编辑阵容</button>
    </div>`;
  openModal('🗼 试炼之塔 · 选择关卡', html, true);
}

function startBattleAt(level) {
  level = Math.floor(Number(level)) || 1;
  level = Math.max(1, Math.min(level, CONFIG.TOWER_MAX_LEVEL));
  if (level > Math.min(g.towerLevel, CONFIG.TOWER_MAX_LEVEL)) return toast(`🔒 第 ${level} 层尚未解锁，需先通关第 ${Math.min(g.towerLevel, CONFIG.TOWER_MAX_LEVEL)} 层`);
  stopBattle();
  const owned = Object.keys(g.collection).filter(n => g.collection[n] > 0);
  if (owned.length < 6) return toast(`至少需要 6 名不同角色才能出战，当前仅有 ${owned.length} 名`);
  autoFillTeam();
  const pTeam = g.playerTeam.filter(n => n && RARITY_MAP.has(n)).map(n => prepareUnit(n, false));
  if (pTeam.length === 0) return toast('阵容为空，请先编辑阵容');
  towerState.selectedLevel = level;
  const eTeam = getEnemyTeam(level);
  openModal(`⚔️ 试炼之塔 · 第 ${level} 层`, renderBattleUI(pTeam, eTeam, level), true);
  setTimeout(() => startBattle(pTeam, eTeam, level), 200);
}

window.selectTowerLevel = (lv) => { towerState.selectedLevel = lv; renderTowerSelect(); };
window.jumpToLevel = () => {
  const v = Math.floor(Number($('towerLevelInput').value));
  if (!v || v < 1 || v > CONFIG.TOWER_MAX_LEVEL) return toast(`请输入 1 ~ ${CONFIG.TOWER_MAX_LEVEL} 之间的层数`);
  if (v > g.towerLevel) return toast(`🔒 第 ${v} 层尚未解锁，需先通关第 ${g.towerLevel} 层`);
  towerState.selectedLevel = v; renderTowerSelect();
};
window.startSelectedFloor = () => startBattleAt(towerState.selectedLevel);
window.goNextFloor = () => startBattleAt(towerState.selectedLevel + 1);
window.retryFloor = () => startBattleAt(towerState.selectedLevel);

function renderTeamEditor() {
  const owned = Object.keys(g.collection).filter(n => g.collection[n] > 0);
  owned.sort((a, b) => {
    const sA = getFinalStats(a, RARITY_MAP.get(a));
    const sB = getFinalStats(b, RARITY_MAP.get(b));
    return (sB.atk + sB.hp / 5) - (sA.atk + sA.hp / 5);
  });

  let slotsHTML = '';
  for (let i = 0; i < 6; i++) {
    const name = g.playerTeam[i];
    if (name && RARITY_MAP.has(name)) {
      const rarity = RARITY_MAP.get(name);
      const eqCount = Object.keys(g.equipment[name] || {}).length;
      slotsHTML += `<div class="team-slot ${teamState.slot === i ? 'active' : ''}" onclick="setTeamSlot(${i})">
        <div class="ts-idx">${i + 1} 号位</div>
        <img src="${getSVGDataURL(RACE[name] || '人类', name)}"/>
        <div class="ts-name" style="color:var(--${rarity.toLowerCase()})">${name}</div>
        <div class="ts-actions">
          <div class="ts-equip" onclick="event.stopPropagation(); equipFromTeam('${name}', '${rarity}')">👕 ${eqCount}/6</div>
          <div class="ts-detail" onclick="event.stopPropagation(); showCharDetailOverlay('${name}', '${rarity}')">🔍 详情</div>
          <div class="ts-remove" onclick="event.stopPropagation(); removeFromTeam(${i})">✕ 移除</div>
        </div>
      </div>`;
    } else {
      g.playerTeam[i] = null;
      slotsHTML += `<div class="team-slot empty ${teamState.slot === i ? 'active' : ''}" onclick="setTeamSlot(${i})">
        <div class="ts-idx">${i + 1} 号位</div>
        <div style="font-size:26px;line-height:52px;height:52px;color:#475569;">＋</div>
        <div class="ts-name" style="color:#475569;">空位</div>
      </div>`;
    }
  }

  let poolHTML = '';
  if (owned.length === 0) {
    poolHTML = '<div style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:20px;">暂无角色，先去抽卡吧！</div>';
  } else {
    const inTeam = new Set(g.playerTeam.filter(Boolean));
    owned.forEach(name => {
      const rarity = RARITY_MAP.get(name) || 'N';
      const used = inTeam.has(name);
      const stats = getFinalStats(name, rarity);
      poolHTML += `<div class="team-char ${used ? 'in-team' : ''}" onclick="addToTeam('${name}')" title="${used ? '已在阵容中' : '点击加入 ' + (teamState.slot + 1) + ' 号位'}">
        <img src="${getSVGDataURL(RACE[name] || '人类', name)}"/>
        <div class="tc-name" style="color:var(--${rarity.toLowerCase()})">${name}</div>
        <div style="font-size:10px;color:#94a3b8;margin-top:2px;">⚔️${stats.atk} ❤️${stats.hp}</div>
        <div class="tc-detail" onclick="event.stopPropagation(); showCharDetailOverlay('${name}', '${rarity}')">🔍 详情</div>
      </div>`;
    });
  }

  const html = `<div class="team-editor-tip">① 点击选择槽位（当前：<b style="color:#fbbf24">${teamState.slot + 1} 号位</b>）　② 点击下方角色入队　③ 点「🔍 详情」查看角色面板，点「✕ 移除」下阵。留空的槽位将在开战时自动用最强角色补齐。</div>
    <div class="team-slots">${slotsHTML}</div>
    <div class="team-editor-tip">选择角色（按战力排序，共 ${owned.length} 名）：</div>
    <div class="team-pool">${poolHTML}</div>

let _pullFxTimer = null, _pullAnimating = false;

function playPullFX(rarity) {
  const fx = $('pullFx'); if (!fx) return;
  const rank = RARITY_ORDER[rarity] || 0;
  const isUR = rarity === 'UR';
  const sparks = isUR ? 64 : rank >= 3 ? 42 : 26;
  let html = '<div class="fx-flash"></div><div class="fx-rays"></div><div class="fx-ring"></div><div class="fx-ring r2"></div>';
  for (let i = 0; i < sparks; i++) {
    const ang = Math.random() * Math.PI * 2;
    const dist = 120 + Math.random() * Math.max(window.innerWidth, window.innerHeight) * 0.55;
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
    const size = 3 + Math.random() * (isUR ? 7 : 5);
    const delay = (Math.random() * 0.25).toFixed(2);
    html += `<i class="fx-spark" style="--dx:${dx.toFixed(0)}px;--dy:${dy.toFixed(0)}px;--s:${size.toFixed(1)}px;--d:${delay}s"></i>`;
  }
  const label = isUR ? ['传说降临', 'UR'] : rank >= 3 ? ['出 金', 'SSR'] : ['稀有出现', 'SR'];
  html += `<div class="fx-label"><b>${label[0]}</b><span>${label[1]} · RARE</span></div>`;
  fx.className = 'show ' + rarity.toLowerCase();
  fx.innerHTML = html;
  void fx.offsetWidth; // 强制重排以重新播放动画
  clearTimeout(_pullFxTimer);
  _pullFxTimer = setTimeout(() => { fx.className = ''; fx.innerHTML = ''; }, 1450);
}
window.playPullFX = playPullFX;

function _bestRarity(results) {
  return results.reduce((best, r) => (RARITY_ORDER[r.rarity] > RARITY_ORDER[best] ? r.rarity : best), 'N');
}

function presentPullResults(results) {
  const best = _bestRarity(results);
  if (RARITY_ORDER[best] < RARITY_ORDER.SR) { renderResults(results); return; }
  _pullAnimating = true;
  playPullFX(best);
  ['btnSingle', 'btnTen'].forEach(function (id) { var b = $(id); if (b) b.disabled = true; });
  const wait = best === 'UR' ? 1000 : best === 'SSR' ? 850 : 650;
  setTimeout(() => {
    try { renderResults(results); }
    finally {
      _pullAnimating = false;
      renderStatus();
      ['btnSingle', 'btnTen'].forEach(function (id) { var b = $(id); if (b) b.disabled = false; });
    }
  }, wait);
}
window.presentPullResults = presentPullResults;

function renderResults(results) {
  const stage = $('stage'); stage.classList.remove('placeholder'); stage.innerHTML = '';
  const frag = document.createDocumentFragment();
  results.forEach((r, i) => {
    const card = document.createElement('div');
    card.className = `card ${r.rarity}`; card.style.animationDelay = `${i * 55}ms`;
    if (r.rarity === 'SR') card.classList.add('reveal-sr');
    if (RARITY_ORDER[r.rarity] >= RARITY_ORDER.SSR) card.classList.add('reveal-gold');
    if (r.rarity === 'UR') card.classList.add('reveal-ur');
    if (RARITY_ORDER[r.rarity] >= RARITY_ORDER.SR) { card.classList.add('reveal-no-anim'); card.style.animationDelay = `0ms, ${280 + i * 110}ms`; }
    card.onclick = () => showCharDetail(r.char, r.rarity); card.title = '点击查看角色详情';
    const race = RACE[r.char] || '人类'; const stats = getFinalStats(r.char, r.rarity);
    card.innerHTML = `<div class="card-avatar"><img src="${getSVGDataURL(race, r.char)}"/></div><div class="card-info"><div class="rarity">${RARITY_ICONS[r.rarity]} ${r.rarity}</div><div class="cname">${r.char}</div><div class="cstars">${getStarsStr(getCharStars(r.char))}</div><div class="crace">${race}</div><div class="cstats"><span>⚔️${stats.atk}</span><span>❤️${stats.hp}</span></div></div>`;
    frag.appendChild(card);
  });
  stage.appendChild(frag);
}

function renderStatus() {
  const b = g.banner;
  $('bannerName').style.color = b.color; $('bannerName').textContent = `🎯 ${b.name}`;
  $('upList').innerHTML = `⭐ 本期 UP：${[...b.limited.SSR, ...b.limited.UR].join(' / ')}`;
  $('coins').textContent = g.coins; $('rollCount').textContent = `已抽 ${g.total} 次`; $('workLeft').textContent = g.workLeft;
  const srLeft = Math.max(0, CONFIG.PITY_SR - g.sinceSR), ssrLeft = Math.max(0, CONFIG.PITY_SSR - g.sinceSSR), urLeft = Math.max(0, CONFIG.PITY_UR - g.sinceUR);
  $('barSR').style.width = Math.min(100, g.sinceSR / CONFIG.PITY_SR * 100) + '%'; $('barSSR').style.width = Math.min(100, g.sinceSSR / CONFIG.PITY_SSR * 100) + '%'; $('barUR').style.width = Math.min(100, g.sinceUR / CONFIG.PITY_UR * 100) + '%';
  $('numSR').textContent = `还差 ${srLeft} 抽`; $('numSSR').textContent = `还差 ${ssrLeft} 抽`; $('numUR').textContent = `还差 ${urLeft} 抽`;
  $('rowSR').classList.toggle('warning', srLeft <= 10); $('rowSSR').classList.toggle('warning', ssrLeft <= 10); $('rowUR').classList.toggle('warning', urLeft <= 30);

let sellSelection = new Set();
function openSellUI() { sellSelection.clear(); renderSellUI(); }

function renderSellUI() {
  const duplicates = []; let totalGold = 0;
  for (const [rarity, chars] of Object.entries(CHARACTERS)) {
    for (const c of chars) { const count = g.collection[c] || 0; if (count > 1) duplicates.push({ name: c, rarity, count }); }
  }
  if (duplicates.length === 0) { openModal('🧺 分解重复角色', '<div style="text-align:center;padding:40px;color:#94a3b8;font-size:16px;">没有可分解的重复角色</div>', false); return; }

  const frag = document.createElement('div'); frag.className = 'dex-grid';
  duplicates.forEach(d => {
    const sel = sellSelection.has(d.name);
    const extra = d.count - 1;
    const price = extra * (SELL_PRICES[d.rarity] || 0);
    if (sel) totalGold += price;
    const el = document.createElement('div');
    el.className = `dex-card sell-card ${sel ? 'selected' : ''}`;
    el.onclick = () => { if (sellSelection.has(d.name)) sellSelection.delete(d.name); else sellSelection.add(d.name); renderSellUI(); };
    el.innerHTML = `<div class="mini-avatar"><img src="${getSVGDataURL(RACE[d.name] || '人类', d.name)}" /></div><div class="d-name" style="color:var(--${d.rarity.toLowerCase()})">${d.name}</div><div class="d-count" style="background:rgba(244,63,94,0.2); color:#fca5a5; margin-top:4px;">分解 ${extra} 张 (+${price})</div><div style="font-size:11px;color:#94a3b8;margin-top:4px;">共拥有 ${d.count} 张</div>`;
    frag.appendChild(el);
  });

  const html = `<div class="dex-filters" style="top: 0; padding-bottom: 10px;"><div class="dex-filter-btn" onclick="toggleSelectAll()">全选 / 取消</div><div style="flex:1; text-align:right; color:#fbbf24; font-weight:800; font-size:16px; line-height:32px;">预计收益：💰 ${totalGold}</div></div><div id="sellGridContainer"></div><div class="sell-bar"><div style="color:#94a3b8;font-size:14px;">已选中 <b style="color:#f43f5e">${sellSelection.size}</b> 种重复角色</div><button onclick="confirmSell()" style="background:linear-gradient(135deg,#f43f5e,#be123c); border-color:#fca5a5; padding:10px 24px; font-size:15px; border-radius:12px; margin:0;" ${sellSelection.size === 0 ? 'disabled' : ''}>确认分解</button></div>`;
  openModal('🧺 选择分解角色', html, true); $('sellGridContainer').appendChild(frag);
}

window.toggleSelectAll = () => {
  const allDupes = [];
  for (const [rarity, chars] of Object.entries(CHARACTERS)) { for (const c of chars) if ((g.collection[c] || 0) > 1) allDupes.push(c); }
  const allSelected = allDupes.every(c => sellSelection.has(c));
  if (allSelected) sellSelection.clear(); else allDupes.forEach(c => sellSelection.add(c));
  renderSellUI();
};

window.confirmSell = () => {
  if (sellSelection.size === 0) return;
  let totalGold = 0, totalCount = 0;
  sellSelection.forEach(name => {
    const rarity = RARITY_MAP.get(name); const count = g.collection[name] || 0; const extra = count - 1;
    if (extra > 0) { totalGold += extra * (SELL_PRICES[rarity] || 0); totalCount += extra; g.collection[name] = 1; }
  });
  g.coins += totalGold; g.earned += totalGold;
  toast(`✅ 成功分解 ${totalCount} 张，获得 ${totalGold} 金币`);
  saveGame(); renderStatus(); $('modal').classList.remove('show');
};

function openRulesUI() {
  const html = `<div class="rule-title">🎲 基础概率</div><div class="rule-text"><ul style="padding-left:20px;margin-top:4px;"><li>⚪ <b>N 阶</b>：72.0%</li><li>🟢 <b>R 阶</b>：21.0%</li><li>🔵 <b>SR 阶</b>：5.5%</li><li>🟡 <b>SSR 阶</b>：1.3%</li><li>🔴 <b>UR 阶</b>：0.2%</li></ul></div><div class="rule-title">🛡️ 保底机制</div><div class="rule-text">• <b>SR 保底（100抽）</b>：连续 100 抽无 SR 及以上，第 100 抽必出 SR+。<br>• <b>SSR 保底（90抽）</b>：连续 90 抽无 SSR/UR，第 90 抽必出 SSR+。<br>• <b>UR 保底（300抽）</b>：连续 300 抽无 UR，第 300 抽必出 UR。</div><div class="rule-title">⭐ 50/50 机制</div><div class="rule-text">• 出金时 50% 为 UP，50% 为常驻。<br>• SSR 与 UR 各自独立计算保底：歪了常驻，下次同品质出金 100% 必中 UP。</div><div class="rule-title">🔄 卡池</div><div class="rule-text">• 共 3 个卡池（龙裔之誓 / 深渊回响 / 圣光黎明），每个卡池均有各自的 SSR 与 UR 限定 UP 角色。<br>• 开局赠送 100 次免费抽卡，用完后单抽 1000 金币、十连 10000 金币。<br>• 切换卡池不重置保底与 50/50 状态。</div><div class="rule-title">🌟 升星系统</div><div class="rule-text">• 消耗重复角色升星，每星提升 20% 属性（满星 5 星）。</div><div class="rule-title">🎒 装备系统</div><div class="rule-text">• 通关试炼之塔掉落装备（武器/头盔/护甲/裤子/鞋子/饰品），分为 N/R/SR/SSR/UR 五种品质，品质越高属性越强。<br>• 每个部位 8 件装备，对应 8 大种族各一件；任何种族都能穿戴，本族装备额外 +10% 专属加成。<br>• 在主界面「出战阵容」或角色详情页可穿戴装备，大幅提升战力。</div><div class="rule-title">⚔️ 战斗系统</div><div class="rule-text">• 上阵最多 6 名角色，包含种族属性克制。<br>• 能量满 100% 点击角色卡释放大招。<br>• 点击任意角色卡可查看详细面板；战斗中点击我方或敌方角色卡都会打开对应面板并暂停战斗，关闭后继续。</div><div class="rule-title">🗼 试炼之塔</div><div class="rule-text">• <b>逐层解锁</b>：共 300 层，通关第 N 层后才能挑战或直达第 N+1 层以内，已通关层可反复挑战；通关第 300 层即全塔通关。<br>• <b>难度递增</b>：层数越高敌人品阶与强化倍率越高（1-5 层 N/R → 6-15 层 R/SR → 16-40 层 SR/SSR → 41-80 层以 SSR 为主 → 81-230 层 SSR/UR 混编 → 231 层起全 UR 阵容）；<b>231 层前强化倍率固定 ×1</b>；231 层起敌方为全 UR 阵容，才开始提升强化倍率，从 ×1 平滑提升到 <b>×3 封顶</b>（300 层正好 ×3，不会超过）；前 20 层敌人数量更少（3~5 名）。<br>• <b>奖励递增</b>：金币标准值 = 1000 × 系数（每 10 层系数 +10%，即 1 + 10% × ⌊(层数-1)/10⌋），实际奖励在标准值 ±20% 随机浮动；首通获得双倍（×2.0），重复挑战 ×0.5；10 层起掉落保底 2 件装备、25 层起保底 3 件，装备品质随层数提升。</div>`;
  openModal('❓ 游戏规则详细说明', html, false);
}

// 图鉴应包含常驻 + 限定（卡池 UP）全部角色
function getAllCharsByRarity(rarity) {
  const list = CHARACTERS[rarity] ? CHARACTERS[rarity].slice() : [];
  for (const b of BANNERS) if (b.limited && b.limited[rarity]) list.push(...b.limited[rarity]);
  return list;
}

const dexState = { owned: true, rarity: 'ALL', race: 'ALL', sort: 'rarity', currentPage: 1, filterOpen: false };
const DEX_SORT_OPTIONS = [
  { key: 'rarity', label: '品质' },
  { key: 'race', label: '种族' },
  { key: 'power', label: '战力' },
  { key: 'count', label: '拥有' },
  { key: 'name', label: '名字' },
];

function renderDex() {
  const { owned, rarity: rar, race: raceFilter, sort } = dexState;
  const list = [];
  for (const r of RARITY_LIST) {
    if (rar !== 'ALL' && r !== rar) continue;
    for (const c of getAllCharsByRarity(r)) {
      const cr = RACE[c] || '人类';
      if (raceFilter !== 'ALL' && cr !== raceFilter) continue;
      if (owned && !g.collection[c]) continue;
      const st = getCharBaseStats(c, r);
      list.push({ name: c, rarity: r, race: cr, power: st.atk + st.hp, count: g.collection[c] || 0 });
    }
  }

  const rarityRank = x => RARITY_ORDER[x];
  const raceRank = x => RACES.indexOf(x);
  list.sort((a, b) => {
    switch (sort) {
      case 'race': return raceRank(a.race) - raceRank(b.race) || rarityRank(b.rarity) - rarityRank(a.rarity);
      case 'power': return b.power - a.power || rarityRank(b.rarity) - rarityRank(a.rarity);
      case 'count': return b.count - a.count || rarityRank(b.rarity) - rarityRank(a.rarity);
      case 'name': return a.name.localeCompare(b.name, 'zh');
      default: return rarityRank(b.rarity) - rarityRank(a.rarity) || raceRank(a.race) - raceRank(b.race);
    }
  });

  const totalPages = Math.ceil(list.length / CONFIG.DEX_PAGE_SIZE) || 1;
  if (dexState.currentPage > totalPages) dexState.currentPage = totalPages;
  if (dexState.currentPage < 1) dexState.currentPage = 1;
  const startIdx = (dexState.currentPage - 1) * CONFIG.DEX_PAGE_SIZE;
  const display = list.slice(startIdx, startIdx + CONFIG.DEX_PAGE_SIZE);
  const ownedCount = list.filter(c => c.count > 0).length;

  const frag = document.createDocumentFragment(); const grid = document.createElement('div'); grid.className = 'dex-grid';
  for (const c of display) {
    const stars = getCharStars(c.name); const imgSrc = getSVGDataURL(c.race, c.name);
    const el = document.createElement('div');
    if (c.count > 0) {
      el.className = 'dex-card'; el.onclick = () => showCharDetail(c.name, c.rarity);
      el.innerHTML = `<div class="mini-avatar"><img src="${imgSrc}" alt="${c.name}"/></div><div class="d-name" style="color:var(--${c.rarity.toLowerCase()})">${c.name}</div><div class="dex-race-tag">${c.race}</div><div class="d-stars">${getStarsStr(stars)}</div><div class="d-count">×${c.count}</div>`;
    } else {
      el.className = 'dex-card locked'; el.innerHTML = `<div class="mini-avatar"><img src="${imgSrc}" alt="?"/></div><div class="d-name">???</div><div class="dex-race-tag">${c.race}</div>`;
    }
    frag.appendChild(el);
  }
  grid.appendChild(frag);

  const db = (label, active, fn) => `<div class="dex-filter-btn ${active ? 'active' : ''}" onclick="${fn}">${label}</div>`;
  const group = (label, btns) => `<div class="dex-filter-group"><span class="dex-filter-label">${label}</span>${btns}</div>`;
  const rarityBtns = ['ALL', ...RARITY_LIST].map(r => db(r === 'ALL' ? '全部' : r, rar === r, `setDexFilter('rarity','${r}')`)).join('');
  const raceBtns = ['ALL', ...RACES].map(r => db(r === 'ALL' ? '全部' : r, raceFilter === r, `setDexFilter('race','${r}')`)).join('');
  const sortBtns = DEX_SORT_OPTIONS.map(s => db(s.label, sort === s.key, `setDexFilter('sort','${s.key}')`)).join('');
  const body = `${group('显示', db('全部', !owned, `setDexFilter('owned', false)`) + db('仅已拥有', owned, `setDexFilter('owned', true)`))}${group('品质', rarityBtns)}${group('种族', raceBtns)}${group('排序', sortBtns)}`;
  const sortLabel = (DEX_SORT_OPTIONS.find(s => s.key === sort) || {}).label || '品质';
  const summary = `${owned ? '已拥有' : '全部'} · 品质:${rar === 'ALL' ? '全部' : rar} · 种族:${raceFilter === 'ALL' ? '全部' : raceFilter} · 排序:${sortLabel}`;
  const filterBar = `<div class="dex-filters"><div class="dex-filter-toggle" onclick="toggleDexFilters()"><span class="dex-filter-toggle-title">🔍 筛选与排序</span><span class="dex-filter-summary">${summary}</span><span class="dex-filter-arrow">${dexState.filterOpen ? '▲' : '▼'}</span></div>${dexState.filterOpen ? `<div class="dex-filter-body">${body}</div>` : ''}</div>`;
  const statHTML = owned
    ? `<div class="stat-row" style="margin-bottom:20px;font-size:16px;"><span>📖 已拥有</span><span>${ownedCount} 个角色</span></div>`
    : `<div class="stat-row" style="margin-bottom:20px;font-size:16px;"><span>📖 筛选结果</span><span>${ownedCount} / ${list.length}</span></div>`;
  $('modalBody').innerHTML = filterBar + statHTML;
  if (list.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'text-align:center;padding:70px 0;color:#94a3b8;font-size:16px;';
    empty.textContent = '🎴 暂无已拥有角色，快去抽卡吧';
    $('modalBody').appendChild(empty);
  } else {
    $('modalBody').appendChild(grid);
  }

  if (totalPages > 1) {
    const pageHTML = `<div class="dex-pagination"><button onclick="changeDexPage(-1)" ${dexState.currentPage <= 1 ? 'disabled' : ''}>上一页</button><span>第 ${dexState.currentPage} / ${totalPages} 页</span><button onclick="changeDexPage(1)" ${dexState.currentPage >= totalPages ? 'disabled' : ''}>下一页</button></div>`;
    const pageEl = document.createElement('div'); pageEl.innerHTML = pageHTML; $('modalBody').appendChild(pageEl);
  }
}
window.setDexFilter = (key, val) => { dexState[key] = val; dexState.currentPage = 1; renderDex(); };
window.toggleDexFilters = () => { dexState.filterOpen = !dexState.filterOpen; renderDex(); };
window.changeDexPage = (delta) => { dexState.currentPage += delta; renderDex(); $('modalBody').scrollTo({ top: 0, behavior: 'smooth' }); };
